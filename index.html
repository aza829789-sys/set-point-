<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Point — ta carrière de tennis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F8F0;
  --surface:#FFFFFF;
  --ink:#132A1D;
  --muted:#647B6C;
  --line:#DDE7D9;
  --ball:#CFEA3E;
  --ball-dark:#AECC2A;
  --clay:#D4632B;
  --net:#153452;
  --gold:#D9A441;
  --red:#D14B3E;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter', sans-serif;
  min-height:100vh;
  padding:24px 16px 60px;
  background-image:
    radial-gradient(circle at 100% 0%, rgba(207,234,62,0.16), transparent 45%),
    radial-gradient(circle at 0% 100%, rgba(21,52,82,0.05), transparent 40%);
}
h1,h2,h3,.heading{font-family:'Poppins', sans-serif;}
.mono{font-family:'Space Mono', monospace;}
.wrap{max-width:960px; margin:0 auto;}

.icon-ball{display:inline-block; vertical-align:middle;}
.court-divider{
  width:100%; height:14px; margin:18px 0;
  background-image:repeating-linear-gradient(90deg, var(--line) 0 22px, transparent 22px 34px);
  background-position:center;
  background-repeat:repeat-x;
  background-size:34px 2px;
  background-position-y:6px;
}

.topbar{
  background:var(--net);
  border-radius:16px;
  padding:20px 24px;
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  margin-bottom:20px;
  color:#fff;
  position:relative;
  overflow:hidden;
}
.topbar::after{
  content:"";
  position:absolute; right:-30px; top:-30px; width:140px; height:140px; border-radius:50%;
  background:radial-gradient(circle, rgba(207,234,62,0.25), transparent 70%);
}
.topbar .brand{display:flex; align-items:center; gap:10px;}
.topbar .brand-name{font-size:20px; font-weight:700; letter-spacing:-0.01em;}
.topbar .brand-sub{font-size:12px; color:#B9C9D6; margin-top:1px;}
.topbar .rank-box{display:flex; align-items:baseline; gap:8px;}
.topbar .rank-lbl{font-size:11px; color:#B9C9D6; text-transform:uppercase; letter-spacing:0.08em;}
.topbar .rank-num{font-size:32px; font-weight:700; color:var(--ball);}
.topbar .rank-delta{font-size:13px;}
.rank-delta.up{color:var(--ball);}
.rank-delta.down{color:#F0897C;}
.rank-delta.flat{color:#B9C9D6;}

.grid{display:grid; grid-template-columns:270px 1fr; gap:16px;}
@media(max-width:740px){.grid{grid-template-columns:1fr;}}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  box-shadow:0 1px 0 rgba(19,42,29,0.02);
}
.card + .card{margin-top:16px;}

.player-name{font-size:19px; font-weight:700;}
.player-sub{font-size:12.5px; color:var(--muted); margin-bottom:16px;}
.stat{margin-bottom:10px;}
.stat-top{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:4px;}
.stat-top b{color:var(--ink); font-weight:600;}
.stat-bar{height:7px; background:#EEF3EA; border-radius:4px; overflow:hidden;}
.stat-bar > span{display:block; height:100%; background:var(--net); border-radius:4px;}
.stat-bar.form > span{background:var(--gold);}
.stat-bar.morale > span{background:#5B9BD1;}

.money-line{display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); font-size:13px;}
.money-line .v{font-weight:700; color:var(--clay);}

.badge-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;}
.badge-row span{font-size:11px; padding:4px 8px; border-radius:20px; background:#EEF3EA; color:var(--muted); font-weight:500;}
.badge-row span.has{background:var(--ball); color:var(--ink);}

.eyebrow{font-size:12px; color:var(--clay); font-weight:600; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px;}
.stage-h{font-size:22px; font-weight:700; margin-bottom:10px;}
.stage-p{font-size:15.5px; line-height:1.6; color:#37493D; margin-bottom:18px;}

.choices{display:flex; flex-direction:column; gap:10px;}
.choice{
  text-align:left; background:#F9FBF7; border:1.5px solid var(--line); border-radius:12px;
  padding:14px 16px; cursor:pointer; font-family:'Inter',sans-serif; font-size:14.5px; color:var(--ink);
  transition:border-color .12s ease, background .12s ease;
}
.choice:hover{border-color:var(--ball-dark); background:#F4FADF;}
.choice .tag{display:block; font-size:11px; font-weight:700; color:var(--net); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px;}
.choice .desc{display:block; font-size:12.5px; color:var(--muted); margin-top:4px;}

.btn{
  font-family:'Poppins',sans-serif; font-weight:600; font-size:14px;
  background:var(--ball); color:var(--ink); border:none; border-radius:10px;
  padding:13px 22px; cursor:pointer;
}
.btn:hover{background:var(--ball-dark);}
.btn.outline{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
.btn.outline:hover{border-color:var(--net);}
.btn.danger{background:var(--red); color:#fff;}

.recap-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:14px;}
.recap-row:last-child{border:none;}
.recap-row .l{color:var(--muted); font-size:12.5px;}
.recap-row .r{font-weight:700;}
.recap-row .r.gold{color:var(--gold);}
.recap-row .r.bad{color:var(--red);}
.recap-row .r.good{color:#4E8C3F;}

.results{display:flex; flex-direction:column; gap:6px; margin:14px 0 18px;}
.result{
  display:flex; justify-content:space-between; font-size:12.5px; padding:8px 10px;
  background:#F9FBF7; border-radius:8px; border-left:3px solid var(--line);
}
.result.title{border-left-color:var(--gold); background:#FBF4E4; font-weight:600;}

.journal{max-height:210px; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:8px;}
.journal-item{font-size:12.5px; color:var(--muted); padding-left:10px; border-left:2px solid var(--line);}
.journal-item b{color:var(--ink);}
.journal::-webkit-scrollbar{width:5px;}
.journal::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

.hero{text-align:center; padding:50px 10px 20px;}
.hero .ball-hero{margin-bottom:18px;}
.hero h1{font-size:44px; font-weight:800; margin-bottom:14px; line-height:1.05;}
.hero h1 span{color:var(--clay);}
.hero p{max-width:520px; margin:0 auto 26px; color:#37493D; font-size:16px; line-height:1.6;}

.field{margin-bottom:18px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.04em;}
.field input[type=text]{
  width:100%; background:#F9FBF7; border:1.5px solid var(--line); color:var(--ink);
  padding:12px 14px; border-radius:10px; font-family:'Inter',sans-serif; font-size:15px;
}
.field input[type=text]:focus{outline:none; border-color:var(--ball-dark);}
.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:520px){.opt-grid{grid-template-columns:1fr;}}
.opt{background:#F9FBF7; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer;}
.opt .h{font-weight:600; font-size:13.5px; margin-bottom:3px;}
.opt .d{font-size:12px; color:var(--muted); line-height:1.4;}
.opt.sel{border-color:var(--ball-dark); background:#F4FADF;}
.opt.sel .h{color:var(--net);}

.rating{
  text-align:center; padding:24px 10px; margin-bottom:20px; background:#F9FBF7;
  border:1px solid var(--line); border-radius:16px;
}
.rating .letter{font-size:74px; font-weight:800; color:var(--gold); line-height:1;}
.rating .flavor{font-size:14.5px; margin-top:6px;}
.rating .score{font-size:12px; color:var(--muted); margin-top:5px;}

.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin:14px 0 20px;}
.badge{background:#F9FBF7; border:1px solid var(--line); border-radius:10px; padding:12px 14px;}
.badge .h{font-weight:600; font-size:13px; color:var(--net); margin-bottom:3px;}
.badge .d{font-size:11.5px; color:var(--muted); line-height:1.4;}

.actions{display:flex; gap:12px; margin-top:20px; flex-wrap:wrap;}
.creation-progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 24px}.creation-progress span{height:4px;background:var(--line);border-radius:5px}.creation-progress span.on{background:var(--ball)}
.footer-note{text-align:center; color:var(--muted); font-size:11.5px; margin-top:32px;}

html,body{width:100%;max-width:100%;overflow-x:hidden}
*{box-sizing:border-box}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
img,svg,canvas{max-width:100%}
@media(max-width:740px){
  body{padding:8px 8px 24px}
  .wrap{width:100%;max-width:100%}
  .topbar{padding:12px 13px;margin-bottom:9px;min-height:56px}
  .topbar .brand-name{font-size:17px}
  .topbar .brand-sub{font-size:9px}
  .topbar .rank-num{font-size:22px}
  .topbar .rank-lbl{font-size:9px}
  .topbar .rank-delta{font-size:10px}
  .grid{grid-template-columns:1fr;gap:9px}
  .card{padding:15px;border-radius:13px;min-width:0}
  .stage-h{font-size:20px}
  .stage-p{font-size:13px;line-height:1.45;overflow-wrap:anywhere}
  .choice{width:100%;padding:12px;border-radius:11px}
  .choice .desc{font-size:11px;line-height:1.35}
  .choice .tag{font-size:9px}
  .actions{display:flex;flex-wrap:wrap;gap:8px}
  .btn{padding:11px 14px}
  .opt-grid{grid-template-columns:1fr 1fr;gap:7px}
  .opt{padding:10px;border-radius:9px}
  .opt .h{font-size:12px}.opt .d{font-size:10px;line-height:1.3}
  .creation-progress{margin-bottom:17px}
  .creation-progress span{height:4px}
  .field input[type=text]{width:100%;font-size:16px}
  .hero{padding:30px 8px 12px}
  .hero h1{font-size:40px}
  .hero p{font-size:14px;line-height:1.5}
  .badges{grid-template-columns:1fr}
}
@media(max-width:390px){
  .opt-grid{grid-template-columns:1fr}
  .topbar .rank-delta{display:none}
  .stage-h{font-size:19px}
}
@media(min-width:741px){
  body{padding:24px 18px 60px}
  .wrap{max-width:1040px}
  .grid{grid-template-columns:280px minmax(0,1fr);align-items:start}
  .card{min-width:0}
}

.decision-gain{margin:0 0 14px;padding:12px 14px;border:1px solid #dfe7df;border-radius:12px;background:#f7faf7}
.decision-gain b{font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.gain-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gain{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}
.gain.up{background:#e5f4e8;color:#17652b}.gain.down{background:#fae7e7;color:#8d2525}.gain.neutral{background:#edf0ed;color:#536057}


.choice.sel{border-color:var(--ball-dark); background:#F4FADF;}
.tourn-banner{padding:14px 16px;border-radius:12px;color:#fff; position:relative; overflow:hidden;}
.tourn-banner::after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,0.12);}
.tourn-banner-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;}
.tourn-banner-sub{font-size:12px;opacity:.85;margin-top:2px;}

.opt.locked{opacity:.55; cursor:not-allowed; background:#F2F4EF;}
.opt.locked .h{color:var(--muted);}

.qualif-banner{
  text-align:center; padding:30px 16px; border-radius:16px;
  background:linear-gradient(180deg, #FBF4E4, var(--surface));
  border:1px solid var(--line);
  position:relative; overflow:hidden;
}
.qualif-banner::before{
  content:"";
  position:absolute; inset:0;
  background-image:radial-gradient(rgba(217,164,65,0.25) 2px, transparent 2px);
  background-size:22px 22px;
  opacity:.5;
}
.qualif-trophy{position:relative;margin-bottom:10px;}
.qualif-title{position:relative; font-family:'Poppins',sans-serif; font-weight:800; font-size:22px; color:var(--net); margin-bottom:8px;}
.qualif-text{position:relative; font-size:14.5px; color:#37493D; max-width:440px; margin:0 auto; line-height:1.55;}

.rating{position:relative; overflow:hidden;}
.rating .rating-bg{position:absolute; top:-10px; right:-10px; opacity:.16;}
.hero-illustration{display:flex; justify-content:center; margin-bottom:26px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============ OUTILS ============ */
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const choose = (arr) => arr[rand(0, arr.length - 1)];
const eur = (v) => v.toLocaleString('fr-FR') + ' €';

const BALL_ICON = (size=28) => `<svg class="icon-ball" width="${size}" height="${size}" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
<circle cx="20" cy="20" r="18" fill="#CFEA3E" stroke="#132A1D" stroke-width="1.5"/>
<path d="M4 12C10 18 10 22 4 28" stroke="#132A1D" stroke-width="1.5" fill="none"/>
<path d="M36 12C30 18 30 22 36 28" stroke="#132A1D" stroke-width="1.5" fill="none"/>
</svg>`;

const TROPHY_ICON = (size=56, color='#D9A441') => `<svg width="${size}" height="${size}" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
<path d="M18 10h28v8c0 9-6 15-14 15S18 27 18 18v-8z" fill="${color}" stroke="#132A1D" stroke-width="1.5"/>
<path d="M18 13H9c0 8 4 12 10 13" fill="none" stroke="${color}" stroke-width="3"/>
<path d="M46 13h9c0 8-4 12-10 13" fill="none" stroke="${color}" stroke-width="3"/>
<rect x="28" y="33" width="8" height="10" fill="${color}" stroke="#132A1D" stroke-width="1.5"/>
<path d="M20 50c0-4 5-7 12-7s12 3 12 7v3H20v-3z" fill="${color}" stroke="#132A1D" stroke-width="1.5"/>
</svg>`;

const COURT_ILLUSTRATION = (w=520,h=280) => `<svg width="${w}" height="${h}" viewBox="0 0 520 280" xmlns="http://www.w3.org/2000/svg">
<rect x="4" y="4" width="512" height="272" rx="14" fill="#1B5E3A"/>
<rect x="24" y="24" width="472" height="232" fill="none" stroke="#F3F8F0" stroke-width="3"/>
<line x1="24" y1="140" x2="496" y2="140" stroke="#F3F8F0" stroke-width="3"/>
<line x1="130" y1="24" x2="130" y2="256" stroke="#F3F8F0" stroke-width="2"/>
<line x1="390" y1="24" x2="390" y2="256" stroke="#F3F8F0" stroke-width="2"/>
<line x1="130" y1="70" x2="390" y2="70" stroke="#F3F8F0" stroke-width="2"/>
<line x1="130" y1="210" x2="390" y2="210" stroke="#F3F8F0" stroke-width="2"/>
<line x1="260" y1="70" x2="260" y2="210" stroke="#F3F8F0" stroke-width="2"/>
<line x1="260" y1="20" x2="260" y2="260" stroke="#153452" stroke-width="4" stroke-dasharray="2 6"/>
<circle cx="260" cy="140" r="11" fill="#CFEA3E" stroke="#132A1D" stroke-width="1.5"/>
</svg>`;

const SLAM_ELIGIBLE_RANK = 200;
const NATION_SLAM_ID = { fr:'rg', uk:'wim', us:'uso', au:'ao' };

/* ============ DONNÉES ============ */
const NATIONS = [
  { id:'fr', label:'France', slam:'Roland-Garros' },
  { id:'uk', label:'Angleterre', slam:'Wimbledon' },
  { id:'us', label:'États-Unis', slam:'US Open' },
  { id:'au', label:'Australie', slam:'Open d\'Australie' },
  { id:'es', label:'Espagne', slam:null },
  { id:'sr', label:'Serbie', slam:null },
  { id:'ar', label:'Argentine', slam:null },
  { id:'ma', label:'Maroc', slam:null },
  { id:'jp', label:'Japon', slam:null },
  { id:'it', label:'Italie', slam:null },
];

const STYLES = [
  { id:'fond', label:'Fond de court', desc:'Endurant, régulier, patient.', mod:{mental:8, physique:5, service:-3, technique:0} },
  { id:'sv', label:'Service-volée', desc:'Rapide au filet, style rare.', mod:{service:10, technique:4, physique:-4, mental:-2} },
  { id:'poly', label:'Polyvalent', desc:'À l\'aise partout, sans excès.', mod:{technique:4, service:4, physique:4, mental:4} },
  { id:'cogneur', label:'Cogneur', desc:'Frappe fort, prend des risques.', mod:{service:8, technique:6, mental:-6, physique:-2} },
];

const BACKGROUNDS = [
  { id:'academie', label:'Académie', desc:'Formation d\'élite, mais chère.', mod:{technique:10, service:4, mental:-4}, money:5000, rep:15 },
  { id:'famille', label:'Coach familial', desc:'Un proche vous a tout appris.', mod:{mental:8, technique:3}, money:2000, rep:5 },
  { id:'muni', label:'Cours municipaux', desc:'Parti de rien, forgé sur le tas.', mod:{physique:10, mental:6, technique:-8, service:-4}, money:500, rep:0 },
];

const TIERS = {
  challenger:{ label:'Challenger', baseOpp:27, oppInc:4, points:[5,12,25,45,80], prize:[400,900,2000,4200,9000], energyCost:6 },
  atp250:{ label:'ATP 250', baseOpp:39, oppInc:4, points:[8,16,30,55,105,170], prize:[3000,6000,12000,25000,55000,120000], energyCost:8 },
  atp500:{ label:'ATP 500', baseOpp:49, oppInc:4, points:[8,16,35,70,140,250], prize:[6000,12000,25000,50000,110000,250000], energyCost:9 },
  masters:{ label:'Masters 1000', baseOpp:59, oppInc:4, points:[10,20,45,90,180,360], prize:[15000,30000,60000,120000,250000,500000], energyCost:11 },
  slam:{ label:'Grand Chelem', baseOpp:67, oppInc:4, points:[10,45,90,180,360,720,1200], prize:[60000,120000,220000,400000,700000,1300000,2400000], energyCost:13 }
};

/* Identité et couleurs des 4 levées du Grand Chelem, par surface */
const SLAMS = [
  { id:'ao', label:'Open d\'Australie', surface:'Dur', place:'Melbourne', colors:{ primary:'#1B4B8C', light:'#EAF2FB', accent:'#4F8FDB' } },
  { id:'rg', label:'Roland-Garros', surface:'Terre battue', place:'Paris', colors:{ primary:'#C1592A', light:'#FBEEE3', accent:'#E0895A' } },
  { id:'wim', label:'Wimbledon', surface:'Gazon', place:'Londres', colors:{ primary:'#1B5E3A', light:'#E7F3EB', accent:'#4C9268' } },
  { id:'uso', label:'US Open', surface:'Dur', place:'New York', colors:{ primary:'#25348C', light:'#EAEBFB', accent:'#5566C7' } },
];

/* Couleurs par défaut pour les autres catégories de tournois */
const TIER_COLORS = {
  challenger:{ primary:'#647B6C', light:'#EEF3EA', accent:'#8AA48F' },
  atp250:{ primary:'#3D6A8C', light:'#E7F0F6', accent:'#5B95BE' },
  atp500:{ primary:'#2C5B75', light:'#E3EFF3', accent:'#4B879F' },
  masters:{ primary:'#5B3E8C', light:'#EFE7F6', accent:'#8B67B8' },
};

function tournamentColors(tierId, slamId){
  if(tierId==='slam'){ const s = SLAMS.find(x=>x.id===slamId) || SLAMS[0]; return s.colors; }
  return TIER_COLORS[tierId] || TIER_COLORS.challenger;
}
function tournamentLabel(tierId, slamId){
  if(tierId==='slam'){ const s = SLAMS.find(x=>x.id===slamId) || SLAMS[0]; return s.label; }
  return TIERS[tierId].label;
}
function tournamentSurface(tierId, slamId){
  if(tierId==='slam'){ const s = SLAMS.find(x=>x.id===slamId) || SLAMS[0]; return s.surface + ' · ' + s.place; }
  if(tierId==='masters') return 'Grand rendez-vous du circuit';
  return 'Circuit international';
}

/* Tactiques disponibles en demi-finale et en finale — un pool large, 3 proposées à chaque fois */
const MATCH_TACTICS = [
  { id:'prudent', label:'Jouer serré', tag:'Prudence', desc:'Moins de prises de risques, vous économisez des forces.', probMod:-0.06, energyCostMod:-3, injuryMod:-1 },
  { id:'normal', label:'Garder votre plan de jeu', tag:'Équilibre', desc:'Vous restez fidèle à vos habitudes.', probMod:0, energyCostMod:0, injuryMod:0 },
  { id:'agressif', label:'Tout risquer', tag:'Audace', desc:'Plus de chances si ça passe, mais fatigue et risques accrus.', probMod:0.09, energyCostMod:5, injuryMod:2 },
  { id:'service', label:'Miser sur le service', tag:'Puissance', desc:'Vous cherchez l\'ace, au prix de plus de doubles fautes.', probMod:0.05, energyCostMod:2, injuryMod:0 },
  { id:'filet', label:'Monter au filet', tag:'Initiative', desc:'Vous raccourcissez les points, mais l\'adversaire peut vous passer.', probMod:0.04, energyCostMod:4, injuryMod:1 },

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=rand(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickTactics(n=3){ return shuffle(MATCH_TACTICS).slice(0,n); }

const RANK_BANDS = [
  [9200, 1], [7500, 5], [6000, 12], [4600, 22], [3400, 40],
  [2400, 65], [1600, 100], [1000, 160], [600, 260], [320, 420],
  [150, 650], [50, 900], [0, 1400]
];

function snapshotStats(p){
  return {technique:p.stats.technique,service:p.stats.service,physique:p.stats.physique,mental:p.stats.mental,morale:p.morale,energy:p.energy,rep:p.rep,money:p.money};
}

function pointsToRank(points){
  for(let i=0;i<RANK_BANDS.length;i++){
    const [threshold, rankAtThreshold] = RANK_BANDS[i];
    if(points >= threshold){
      if(i===0) return rankAtThreshold;
      const [prevThreshold, prevRank] = RANK_BANDS[i-1];
      const span = prevThreshold - threshold;
      const frac = span<=0 ? 0 : (points - threshold) / span;
      return Math.max(1, Math.round(rankAtThreshold - frac*(rankAtThreshold - prevRank)));
    }
  }
  return 1400;
}

/* ============ CALENDRIER DE BASE (petits tournois) ============ */
function planSeason(rank, intensityId, age){
  const mult = intensityId==='leger' ? 0.55 : intensityId==='intensif' ? 1.6 : 1;
  const fill = (tier,n) => Array(Math.max(0, Math.round(n*mult))).fill(tier);
  let plan = [];
  if(age>=21){
    if(rank>800) plan=[...fill('challenger',3),...fill('atp250',3)];
    else if(rank>500) plan=[...fill('challenger',1),...fill('atp250',4),...fill('atp500',2)];
    else if(rank>250) plan=[...fill('atp250',3),...fill('atp500',3)];
    else if(rank>100) plan=[...fill('atp500',4)];
    else plan=[...fill('atp500',2)];
  }else if(age>=19){
    if(rank>900) plan=[...fill('challenger',3),...fill('atp250',4)];
    else if(rank>500) plan=[...fill('challenger',1),...fill('atp250',4),...fill('atp500',2)];
    else plan=[...fill('atp250',4),...fill('atp500',2)];
  }else if(age>=17){
    plan=[...fill('challenger',5),...fill('atp250',2)];
  }else{
    plan=[...fill('challenger',5),...fill('atp250',1)];
  }
  return plan;
}

function skillOf(p){
  const s = p.stats;
  const base = s.technique*0.28 + s.service*0.24 + s.physique*0.22 + s.mental*0.26 + 6;
  const form = (0.78 + 0.4*(p.energy/100)) * (0.85 + 0.3*(p.morale/100));
  return base * form;
}

function roundLabel(roundsWon, totalRounds){
  const labels = ['1er tour','2e tour','3e tour','8es de finale','quarts de finale','demi-finale','finale','Titre 🏆'];
  const fromEnd = totalRounds - roundsWon;
  if(roundsWon === totalRounds) return 'Titre 🏆';
  const idx = Math.max(0, labels.length - 1 - fromEnd);
  return labels[Math.min(idx, labels.length-2)];
}

function ageAdjust(p){
  if(p.age<=23){
    p.stats.technique = clamp(p.stats.technique + rand(0,2), 5, 99);
    p.stats.service = clamp(p.stats.service + rand(0,2), 5, 99);
    p.stats.physique = clamp(p.stats.physique + rand(0,2), 5, 99);
    p.stats.mental = clamp(p.stats.mental + rand(0,2), 5, 99);
  } else if(p.age<=29){
    p.stats.mental = clamp(p.stats.mental + rand(0,1), 5, 99);
  } else if(p.age<=32){
    p.stats.physique = clamp(p.stats.physique - rand(0,2), 5, 99);
  } else {
    p.stats.physique = clamp(p.stats.physique - rand(1,3), 5, 99);
    p.stats.service = clamp(p.stats.service - rand(0,1), 5, 99);
  }
}

/* ============ MOTEUR DE SAISON, PAS À PAS ============ */
function startSeason(p, choice){
  ageAdjust(p);
  if(p.skipSeason){
    p.skipSeason = false;
    p.lastRecap = { intensity:'Saison blanche', played:0, stopped:true, results:[], titlesThisSeason:[], seasonPoints:0, seasonPrize:0, rankBefore:p.rank, rankAfter:p.rank };
    log(p, 'Saison blanche après une opération.');
    p.energy = clamp(p.energy+50,0,100);
    p.seasonsPlayed++;
    p.phase = 'recap';
    render();
    return;
  }
  const basePlan = planSeason(p.rank, choice.intensity, p.age);
  const queue = basePlan.map(t=>({tier:t, slamId:null}));
  Object.keys(choice.slams).forEach(sid=>{ if(choice.slams[sid]) queue.push({tier:'slam', slamId:sid}); });
  for(let i=0;i<choice.masters;i++){ queue.push({tier:'masters', slamId:null}); }
  p.seasonRun = {
    queue, idx:0, results:[], seasonPoints:0, seasonPrize:0, titlesThisSeason:[], stopped:false,
    current:null, intensityLabel: CALENDAR_OPTIONS.find(c=>c.id===choice.intensity).label,
  };
  advanceSeason(p);
}

function advanceSeason(p){
  const run = p.seasonRun;
  if(!run.current){
    if(p.energy < 12 || run.idx >= run.queue.length){ finalizeSeason(p); return; }
    const item = run.queue[run.idx]; run.idx++;
    const totalRounds = TIERS[item.tier].points.length - 1;
    run.current = { tier:item.tier, slamId:item.slamId, roundIndex:0, totalRounds, roundsWon:0, injuryBonus:0 };
  }
  simulateRounds(p);
}

function playRound(p, cur, tacticMod){
  const tier = TIERS[cur.tier];
  const baseSkill = skillOf(p);
  const oppSkill = tier.baseOpp + cur.roundIndex*tier.oppInc + rand(-6,6);
  const eff = baseSkill + rand(-5,5) + 12;
  const winProb = clamp(eff/(eff+oppSkill) + tacticMod, 0.02, 0.98);
  const won = Math.random() < winProb;
  const roundCost = 2 + Math.floor(tier.energyCost / cur.totalRounds);
  p.energy = clamp(p.energy - roundCost, 0, 100);
  return won;
}

function simulateRounds(p){
  const run = p.seasonRun; const cur = run.current;
  while(cur.roundIndex < cur.totalRounds){
    const isSemi = cur.roundIndex === cur.totalRounds - 2;
    const isFinal = cur.roundIndex === cur.totalRounds - 1;
    if(isSemi || isFinal){
      p.phase = 'match_choice';
      render();
      return;
    }
    const won = playRound(p, cur, 0);
    if(!won){ finishTournament(p, false); return; }
    cur.roundIndex++;
    cur.roundsWon++;
  }
  finishTournament(p, true);
}

function resolveTactic(p, tacticId){
  const run = p.seasonRun; const cur = run.current;
  const t = (cur.tacticOptions || MATCH_TACTICS).find(x=>x.id===tacticId) || MATCH_TACTICS.find(x=>x.id===tacticId);
  cur.tacticOptions = null;
  const won = playRound(p, cur, t.probMod);
  p.energy = clamp(p.energy - t.energyCostMod, 0, 100);
  cur.injuryBonus += t.injuryMod;
  if(!won){ finishTournament(p, false); return; }
  cur.roundIndex++;
  cur.roundsWon++;
  if(cur.roundIndex >= cur.totalRounds){ finishTournament(p, true); return; }
  simulateRounds(p);
}

function finishTournament(p, champion){
  const run = p.seasonRun; const cur = run.current; const tier = TIERS[cur.tier];
  const points = tier.points[cur.roundsWon];
  const prize = tier.prize[cur.roundsWon];
  run.seasonPoints += points;
  run.seasonPrize += prize;
  if(champion){
    p.titles[cur.tier]++; run.titlesThisSeason.push(tournamentLabel(cur.tier, cur.slamId));
    if(cur.tier==='slam' && NATION_SLAM_ID[p.nation.id]===cur.slamId){ p.wonHomeSlam = true; }
  }
  const res = { tier:cur.tier, slamId:cur.slamId, roundsWon:cur.roundsWon, totalRounds:cur.totalRounds, points, prize, champion };
  run.results.push(res);
  const injuryChance = 1.5 + (100-p.stats.physique)*0.10 + (100-p.energy)*0.08 + cur.injuryBonus;
  let injured = false;
  if(rand(1,100) <= injuryChance){ injure(p, choose(['cheville','genou','épaule','dos','poignet'])); injured = true; run.stopped = true; }
  run.current = null;
  p.lastTournamentResult = { ...res, injured };
  p.phase = 'tournament_result';
  render();
}

function finalizeSeason(p){
  const run = p.seasonRun;
  p.money += run.seasonPrize;
  p.points = Math.round(p.points*0.96 + run.seasonPoints);
  p.prevRank = p.rank;
  p.rank = pointsToRank(p.points);
  if(p.rank < p.bestRank) p.bestRank = p.rank;
  if(!p.slamEligible && p.rank <= SLAM_ELIGIBLE_RANK){ p.slamEligible = true; p.pendingSlamQualified = true; }
  p.seasonsPlayed++;
  p.energy = clamp(p.energy + 55, 0, 100);
  p.morale = clamp(p.morale + (p.morale<55 ? 8 : 2), 0, 100);
  p.lastRecap = {
    intensity: run.intensityLabel, played: run.results.length, stopped: run.stopped, results: run.results,
    titlesThisSeason: run.titlesThisSeason, seasonPoints: run.seasonPoints, seasonPrize: run.seasonPrize,
    rankBefore: p.prevRank, rankAfter: p.rank,
  };
  if(run.titlesThisSeason.length){ log(p, `${run.titlesThisSeason.length} titre(s) : ${run.titlesThisSeason.join(', ')}.`); }
  log(p, `Fin de saison, classement #${p.rank}.`);
  p.seasonRun = null;
  p.phase = 'recap';
  render();
}

function legendScore(p){
  let score = p.titles.slam*100 + p.titles.masters*35 + p.titles.atp500*12 + p.titles.atp250*6 + p.titles.challenger*1.5;
  if(p.bestRank===1) score += 90;
  else if(p.bestRank<=5) score += 50;
  else if(p.bestRank<=10) score += 30;
  else if(p.bestRank<=50) score += 12;
  else if(p.bestRank<=100) score += 5;
  score += Math.floor(p.money/500000);
  score += p.seasonsPlayed*1.2;
  score -= p.injuries.length*4;
  return Math.max(0, Math.round(score));
}
const RATING_FLAVORS = {
  S: ['Une carrière hors normes.', 'Un nom que le circuit n\'oubliera pas.', 'L\'histoire du tennis retiendra ce nom.'],
  A: ['Un grand nom du circuit.', 'Une carrière de tout premier plan.', 'Le genre de parcours qu\'on raconte encore.'],
  B: ['Une très belle carrière.', 'Un parcours solide et respecté.', 'De quoi être fier, saison après saison.'],
  C: ['Une carrière solide sur le circuit.', 'Un professionnel du circuit, sans éclat majeur.', 'Un parcours honnête, fait de hauts et de bas.'],
  D: ['Modeste, mais un rêve vécu.', 'Peu de trophées, mais une vraie aventure.', 'Le circuit vous aura appris beaucoup.'],
  E: ['Le circuit ne vous aura pas gardé.', 'Une carrière écourtée, sans grand résultat.', 'Le rêve était là, les résultats moins.'],
};
function legendRating(score){
  let letter;
  if(score>=180) letter='S';
  else if(score>=110) letter='A';
  else if(score>=60) letter='B';
  else if(score>=25) letter='C';
  else if(score>=8) letter='D';
  else letter='E';
  return { letter, flavor: choose(RATING_FLAVORS[letter]) };
}
function careerNarrative(p){
  const totalTitles = Object.values(p.titles).reduce((a,b)=>a+b,0);
  const parts = [];
  parts.push(`${p.name}, ${p.nation.label}, aura passé ${p.seasonsPlayed} saison${p.seasonsPlayed>1?'s':''} sur le circuit avec un style ${p.style.label.toLowerCase()}.`);
  if(p.titles.slam>=1){ parts.push(p.wonHomeSlam ? 'Le sommet a été atteint jusque devant son propre public, sur son tournoi national.' : 'Le Grand Chelem aura été conquis, au moins une fois.'); }
  else if(p.bestRank<=50){ parts.push(`Le top ${p.bestRank<=10?'10':'50'} mondial aura été approché de très près, sans jamais soulever de trophée majeur.`); }
  else if(totalTitles>0){ parts.push('Les titres sont restés modestes, mais bien réels.'); }
  else { parts.push('Les titres n\'auront jamais suivi, malgré les efforts.'); }
  if(p.injuries.length>=3){ parts.push('Le corps aura payé cher cette carrière, entre blessures et rééducations.'); }
  else if(p.injuries.length===0){ parts.push('Un corps qui aura tenu bon, saison après saison.'); }
  return parts.join(' ');
}
function computeBadges(p){
  const b = [];
  if(p.titles.slam>=1) b.push({h:'Champion du Grand Chelem', d:'Vous avez soulevé un trophée majeur.'});
  if(p.titles.slam>=3) b.push({h:'Multiple champion majeur', d:'Trois titres majeurs ou plus.'});
  if(p.bestRank===1) b.push({h:'Numéro 1 mondial', d:'Vous avez atteint le sommet.'});
  if(p.injuries.length===0 && p.seasonsPlayed>=10) b.push({h:'Increvable', d:'Dix saisons sans aucune blessure.'});
  if(p.seasonsPlayed>=18) b.push({h:'Grande longévité', d:'Une carrière très longue.'});
  if(p.background.id==='muni' && legendScore(p)>=60) b.push({h:'Parti de rien', d:'Des cours municipaux jusqu\'au sommet.'});
  const totalTitles = Object.values(p.titles).reduce((a,b)=>a+b,0);
  if(totalTitles===0 && p.seasonsPlayed>=10) b.push({h:'Pour l\'expérience', d:'Une longue carrière sans trophée.'});
  if(p.injuries.length>=4) b.push({h:'Corps de guerrier', d:'Quatre blessures ou plus, sans jamais abandonner.'});
  if(p.money>=5000000) b.push({h:'Fortune du circuit', d:'Plus de 5 millions d\'euros de gains.'});
  if(p.wonHomeSlam) b.push({h:'Enfant du pays', d:'Un titre du Grand Chelem remporté devant votre public.'});
  if(p.slamEligible && p.titles.slam===0) b.push({h:'Qualifié, jamais couronné', d:'Le Grand Chelem vous a ouvert ses portes, sans jamais céder son trophée.'});
  if(!p.slamEligible) b.push({h:'Resté loin des grandes scènes', d:'Le Grand Chelem ne vous aura jamais été accessible.'});
  if(!b.length) b.push({h:'Une carrière sur le circuit', d:'Chaque saison a été une bataille.'});
  return b;
}

      <div class="recap-row"><span class="l">Style</span><span class="r">${creation.style.label}</span></div>
      <div class="recap-row"><span class="l">Formation</span><span class="r">${creation.background.label}</span></div>
    `;
  }

  app.innerHTML = `
    <div class="card" style="max-width:620px;margin:26px auto;">
      <div class="creation-progress">${Array.from({length:steps},(_,i)=>`<span class="${i<=creation.step?'on':''}"></span>`).join('')}</div>
      ${content}
      <div class="actions">
        ${creation.step>0 ? `<button class="btn outline" onclick="creation.step--; renderCreation()">←</button>` : `<button class="btn outline" onclick="player=null; render()">Retour</button>`}
        ${creation.step===0 ? `<button class="btn" onclick="creationNext()">Continuer →</button>` : ''}
        ${creation.step===4 ? `<button class="btn" onclick="startCareer()">Entrer sur le circuit</button>` : ''}
      </div>
    </div>
  `;

  if(creation.step===0){
    const input=document.getElementById('nameInput');
    input.addEventListener('input',e=>creation.name=e.target.value);
    input.focus();
  }

  if(creation.step===1){
    const grid=document.getElementById('nationGrid');
    NATIONS.forEach(n=>{
      const d=document.createElement('div');
      d.className='opt'+(creation.nation.id===n.id?' sel':'');
      d.innerHTML=`<div class="h">${n.label}</div><div class="d">${n.slam || 'Circuit international'}</div>`;
      d.onclick=()=>{creation.nation=n; creation.step=2; renderCreation();};
      grid.appendChild(d);
    });
  }

  if(creation.step===2){
    const grid=document.getElementById('styleGrid');
    STYLES.forEach(x=>{
      const d=document.createElement('div');
      d.className='opt'+(creation.style.id===x.id?' sel':'');
      d.innerHTML=`<div class="h">${x.label}</div><div class="d">${x.desc}</div>`;
      d.onclick=()=>{creation.style=x; creation.step=3; renderCreation();};
      grid.appendChild(d);
    });
  }

  if(creation.step===3){
    const grid=document.getElementById('bgGrid');
    BACKGROUNDS.forEach(x=>{
      const d=document.createElement('div');
      d.className='opt'+(creation.background.id===x.id?' sel':'');
      d.innerHTML=`<div class="h">${x.label}</div><div class="d">${x.desc}</div>`;
      d.onclick=()=>{creation.background=x; creation.step=4; renderCreation();};
      grid.appendChild(d);
    });
  }
}

function creationNext(){
  const input=document.getElementById('nameInput');
  creation.name=input ? input.value.trim() : creation.name;
  if(!creation.name){
    input && input.focus();
    return;
  }
  creation.step=1;
  renderCreation();
}

function startCareer(){ player = newPlayer(); usedEvents = []; usedFunnyEvents = []; usedSeriousEvents = []; render(); }
function pickEvent(p){
  const ALL_FUNNY_EVENTS = FUNNY_EVENTS.concat(FUNNY_VARIANTS);
  const eligibleFunny = ALL_FUNNY_EVENTS.filter(e => p.age>=e.min && p.age<=e.max);
  const eligibleSerious = EVENTS.filter(e => p.age>=e.min && p.age<=e.max);
  let funny = eligibleFunny.filter(e => !usedFunnyEvents.includes(e.id));
  let serious = eligibleSerious.filter(e => !usedSeriousEvents.includes(e.id));

  let pool, isFunny;
  if(Math.random() < 0.68 && funny.length){ pool = funny; isFunny = true; }
  else if(serious.length){ pool = serious; isFunny = false; }
  else if(funny.length){ pool = funny; isFunny = true; }
  else {
    if(eligibleFunny.length){ usedFunnyEvents = []; funny = eligibleFunny; }
    if(eligibleSerious.length){ usedSeriousEvents = []; serious = eligibleSerious; }
    if(Math.random() < 0.68 && funny.length){ pool = funny; isFunny = true; }
    else { pool = serious.length ? serious : funny; isFunny = !serious.length; }
  }
  const ev = choose(pool);
  if(isFunny) usedFunnyEvents.push(ev.id); else usedSeriousEvents.push(ev.id);
  usedEvents.push(ev.id);
  return ev;
}

function renderGame(){

  const deltaVal = p.prevRank - p.rank;

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        ${BALL_ICON(30)}
        <div>
          <div class="brand-name">Set Point</div>
          <div class="brand-sub">Saison ${p.season} · ${p.age} ans</div>
        </div>
      </div>
      <div class="rank-box">
        <span class="rank-lbl">Classement</span>
        <span class="rank-num mono">#${p.rank}</span>
        <span class="rank-delta ${deltaClass} mono">${deltaText}</span>
      </div>
    </div>

    <div class="grid">
      <div>
        <div class="card">
          <div class="player-name">${p.name}</div>
          <div class="player-sub">${NATIONS.find(n=>n.id===p.nation.id).label} · ${p.style.label}</div>

          <div class="stat"><div class="stat-top"><span>Technique</span><b>${Math.round(p.stats.technique)}</b></div><div class="stat-bar"><span style="width:${p.stats.technique}%"></span></div></div>
          <div class="stat"><div class="stat-top"><span>Service</span><b>${Math.round(p.stats.service)}</b></div><div class="stat-bar"><span style="width:${p.stats.service}%"></span></div></div>
          <div class="stat"><div class="stat-top"><span>Physique</span><b>${Math.round(p.stats.physique)}</b></div><div class="stat-bar"><span style="width:${p.stats.physique}%"></span></div></div>
          <div class="stat"><div class="stat-top"><span>Mental</span><b>${Math.round(p.stats.mental)}</b></div><div class="stat-bar"><span style="width:${p.stats.mental}%"></span></div></div>
          <div class="stat"><div class="stat-top"><span>Forme</span><b>${Math.round(p.energy)}</b></div><div class="stat-bar form"><span style="width:${p.energy}%"></span></div></div>
          <div class="stat"><div class="stat-top"><span>Moral</span><b>${Math.round(p.morale)}</b></div><div class="stat-bar morale"><span style="width:${p.morale}%"></span></div></div>

          <div class="money-line"><span>Gains</span><span class="v">${eur(p.money)}</span></div>
          <div class="money-line"><span>Sponsors</span><span class="v">${p.sponsors}</span></div>
          <div class="money-line"><span>Meilleur classement</span><span class="v">#${p.bestRank}</span></div>

          <div class="badge-row">
            <span class="${p.titles.slam?'has':''}">Slam ×${p.titles.slam}</span>
            <span class="${p.titles.masters?'has':''}">M1000 ×${p.titles.masters}</span>
            <span class="${p.titles.atp500?'has':''}">ATP500 ×${p.titles.atp500}</span>
            <span class="${p.titles.atp250?'has':''}">ATP250 ×${p.titles.atp250}</span>
            <span class="${p.titles.challenger?'has':''}">Chall. ×${p.titles.challenger}</span>
          </div>
        </div>

        <div class="card">
          <div class="eyebrow">Journal</div>
          <div class="journal" id="journal"></div>
        </div>
      </div>

      <div><div class="card" id="stage"></div></div>
    </div>
  `;

  const journal = document.getElementById('journal');
  p.journal.slice(-40).forEach(entry=>{
    const d = document.createElement('div');
    d.className = 'journal-item';
    d.innerHTML = `<b>S${entry.season} · ${entry.age} ans —</b> ${entry.text}`;
    journal.appendChild(d);
  });

function renderStage(){
  const p = player;
  const stage = document.getElementById('stage');

  if(p.phase === 'event'){
    stage.style.background = '';
    const ev = pendingEvent || (pendingEvent = pickEvent(p));
    stage.innerHTML = `
      <div class="eyebrow">Saison ${p.season}</div>
      <div class="stage-h">${ev.title}</div>
      <div class="stage-p">${ev.text}</div>
      <div class="choices" id="choicesWrap"></div>
    `;
    const wrap = document.getElementById('choicesWrap');
    ev.choices.forEach(c=>{
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.innerHTML = `<span class="tag">${c.tag}</span>${c.label}<span class="desc">${c.desc}</span>`;
      btn.onclick = ()=>{
        const before = snapshotStats(p);
        c.effect(p);
        const after = snapshotStats(p);
        p.lastDecisionGain = { title: ev.title, choiceLabel: c.label, before, after };
        pendingEvent = null;
        p.phase = 'decision_result';
        render();
      };
      wrap.appendChild(btn);
    });

  } else if(p.phase === 'decision_result'){
    stage.style.background = '';
    const g = p.lastDecisionGain;
    const labels = { technique:'Technique', service:'Service', physique:'Physique', mental:'Mental', morale:'Moral', energy:'Forme', rep:'Réputation', money:'Argent' };
    const rows = Object.keys(labels).map(k=>{
      const d = g.after[k] - g.before[k];
      if(Math.abs(d) < 0.01) return '';
      const cls = d>0 ? 'good' : 'bad';
      const val = k==='money'
        ? (d>0?'+':'') + eur(Math.round(d))
        : (d>0?'+':'') + (Number.isInteger(d) ? d : d.toFixed(1));
      return `<div class="recap-row"><span class="l">${labels[k]}</span><span class="r ${cls}">${val}</span></div>`;
    }).join('');
    stage.innerHTML = `
      <div class="eyebrow">Conséquences</div>
      <div class="stage-h">${g.choiceLabel}</div>
      <div class="stage-p">${g.title}</div>
      ${rows || '<div class="stage-p">Aucun changement mesurable.</div>'}
      <div class="actions"><button class="btn" id="contDecisionBtn">Continuer</button></div>
    `;
    document.getElementById('contDecisionBtn').onclick = ()=>{ calendarChoice = null; p.phase = 'calendar'; render(); };

  } else if(p.phase === 'calendar'){
    stage.style.background = '';
    if(p.skipSeason){
      startSeason(p, {intensity:'standard', slams:{}, masters:0});
      return;
    }
    renderCalendarPhase();

  } else if(p.phase === 'match_choice'){
    const run = p.seasonRun; const cur = run.current;
    const colors = tournamentColors(cur.tier, cur.slamId);
    stage.style.background = colors.light;
    const isFinal = cur.roundIndex === cur.totalRounds-1;
    const stageLabel = isFinal ? 'Finale' : 'Demi-finale';
    const intro = choose(isFinal ? MATCH_INTROS_FINAL : MATCH_INTROS_SEMI);
    if(!cur.tacticOptions) cur.tacticOptions = pickTactics(3);
    stage.innerHTML = `
      <div class="tourn-banner" style="background:${colors.primary};">
        <div class="tourn-banner-name">${tournamentLabel(cur.tier, cur.slamId)}</div>
        <div class="tourn-banner-sub">${tournamentSurface(cur.tier, cur.slamId)}</div>
      </div>
      <div class="eyebrow" style="margin-top:14px;">${stageLabel}</div>
      <div class="stage-h">Quelle tactique adopter ?</div>
      <div class="stage-p"><i>${intro}</i><br>Forme : ${Math.round(p.energy)} · Mental : ${Math.round(p.stats.mental)}</div>
      <div class="choices" id="tacticWrap"></div>
    `;
    const wrap = document.getElementById('tacticWrap');
    cur.tacticOptions.forEach(t=>{
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.style.borderLeft = `3px solid ${colors.primary}`;
      btn.innerHTML = `<span class="tag" style="color:${colors.primary}">${t.tag}</span>${t.label}<span class="desc">${t.desc}</span>`;
      btn.onclick = ()=>{ resolveTactic(p, t.id); };
      wrap.appendChild(btn);
    });

  } else if(p.phase === 'tournament_result'){
    const r = p.lastTournamentResult;
    const colors = tournamentColors(r.tier, r.slamId);
    stage.style.background = colors.light;
    const rl = roundLabel(r.roundsWon, r.totalRounds);
    stage.innerHTML = `
      <div class="tourn-banner" style="background:${colors.primary};">
        <div class="tourn-banner-name">${tournamentLabel(r.tier, r.slamId)}</div>
        <div class="tourn-banner-sub">${tournamentSurface(r.tier, r.slamId)}</div>
      </div>
      <div class="eyebrow" style="margin-top:14px;">Résultat</div>
      <div class="stage-h">${rl}</div>
      <div class="recap-row"><span class="l">Points</span><span class="r good">+${r.points}</span></div>
      <div class="recap-row"><span class="l">Gains</span><span class="r gold">${eur(r.prize)}</span></div>
      ${r.injured ? '<div class="recap-row"><span class="l">Incident</span><span class="r bad">Blessure en fin de tournoi</span></div>' : ''}
      <div class="actions"><button class="btn" id="contTournBtn">Continuer</button></div>
    `;
    document.getElementById('contTournBtn').onclick = ()=>{ advanceSeason(p); };

  } else if(p.phase === 'recap'){
    stage.style.background = '';
    const r = p.lastRecap;
    let resultsHtml = '';
    if(r.results.length){
      resultsHtml = '<div class="results">' + r.results.map(res=>{
        const rl = roundLabel(res.roundsWon, res.totalRounds);
        const colors = tournamentColors(res.tier, res.slamId);
        return `<div class="result ${res.champion?'title':''}" style="border-left-color:${colors.primary}"><span>${tournamentLabel(res.tier, res.slamId)}</span><span>${rl}</span></div>`;
      }).join('') + '</div>';
    }
    stage.innerHTML = `
      <div class="eyebrow">Saison ${p.season} · Bilan</div>
      <div class="stage-h">${r.intensity}</div>
      ${resultsHtml || '<div class="stage-p">Saison écourtée, sans résultats.</div>'}
      <div class="recap-row"><span class="l">Tournois disputés</span><span class="r">${r.played}</span></div>
      <div class="recap-row"><span class="l">Points gagnés</span><span class="r good">+${r.seasonPoints}</span></div>
      <div class="recap-row"><span class="l">Gains de la saison</span><span class="r gold">${eur(r.seasonPrize)}</span></div>
      <div class="recap-row"><span class="l">Classement</span><span class="r">#${r.rankBefore} → #${r.rankAfter}</span></div>
      ${r.stopped ? '<div class="recap-row"><span class="l">Incident</span><span class="r bad">Saison interrompue</span></div>' : ''}
      <div class="actions"><button class="btn" id="nextSeasonBtn">Saison suivante</button></div>
    `;
    document.getElementById('nextSeasonBtn').onclick = ()=>{
      p.season++; p.age++;
      if(p.pendingSlamQualified){ p.pendingSlamQualified = false; p.phase = 'slam_qualified'; }
      else { p.phase = 'event'; }
      render();
    };

  } else if(p.phase === 'slam_qualified'){
    stage.style.background = '';
    stage.innerHTML = `
      <div class="qualif-banner">
        <div class="qualif-trophy">${TROPHY_ICON(60)}</div>
        <div class="qualif-title">Qualifié pour le Grand Chelem !</div>
        <div class="qualif-text">Classé #${p.rank}, ${p.name} peut désormais s'inscrire aux quatre levées du Grand Chelem : Open d'Australie, Roland-Garros, Wimbledon et US Open.</div>
      </div>
      <div class="actions"><button class="btn" id="contQualifBtn">Continuer</button></div>
    `;
    document.getElementById('contQualifBtn').onclick = ()=>{ p.phase = 'event'; render(); };
  }
}

function renderCalendarPhase(){
  const p = player;
  if(!calendarChoice) calendarChoice = { intensity:'standard', slams:{}, masters:0 };
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="eyebrow">Saison ${p.season}</div>
    <div class="stage-h">Composez votre saison</div>
    <div class="stage-p">Classement actuel : #${p.rank}. Choisissez le rythme des petits tournois, puis ajoutez les grands rendez-vous que vous voulez disputer — chacun rallonge la saison.
    ${p.slamEligible ? '' : `<br><span style="color:var(--muted);">Le Grand Chelem se débloque sous le rang #${SLAM_ELIGIBLE_RANK}.</span>`}</div>
    <div class="eyebrow" style="margin-top:6px;">Calendrier de base</div>
    <div class="choices" id="calWrap"></div>
    <div class="eyebrow" style="margin-top:18px;">Grands tournois</div>
    <div class="opt-grid" id="bigWrap"></div>
    ${p.age>=30 ? '<div style="margin-top:16px;"><button class="btn danger" id="retireBtn">Annoncer votre retraite</button></div>' : ''}
    <div class="actions"><button class="btn" id="launchSeasonBtn">Lancer la saison</button></div>
  `;

  const calWrap = document.getElementById('calWrap');
  CALENDAR_OPTIONS.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'choice' + (calendarChoice.intensity===c.id ? ' sel' : '');
    btn.innerHTML = `<span class="tag">${c.tag}</span>${c.label}<span class="desc">${c.desc}</span>`;
    btn.onclick = ()=>{ calendarChoice.intensity = c.id; renderCalendarPhase(); };
    calWrap.appendChild(btn);
  });

  const bigWrap = document.getElementById('bigWrap');
  SLAMS.forEach(s=>{
    const sel = !!calendarChoice.slams[s.id];
    const locked = !p.slamEligible;
    const d = document.createElement('div');
    d.className = 'opt' + (sel ? ' sel' : '') + (locked ? ' locked' : '');
    d.style.borderLeft = `4px solid ${locked ? '#C7D0C4' : s.colors.primary}`;
    d.innerHTML = locked
      ? `<div class="h">${s.label} 🔒</div><div class="d">Débloqué sous le rang #${SLAM_ELIGIBLE_RANK}</div>`
      : `<div class="h">${s.label}</div><div class="d">${s.surface} · ${s.place}</div>`;
    if(!locked){ d.onclick = ()=>{ calendarChoice.slams[s.id] = !calendarChoice.slams[s.id]; renderCalendarPhase(); }; }
    bigWrap.appendChild(d);
  });

  const mCard = document.createElement('div');
  mCard.className = 'opt';
  mCard.style.borderLeft = `4px solid ${TIER_COLORS.masters.primary}`;
  mCard.innerHTML = `<div class="h">Masters 1000</div><div class="d">${calendarChoice.masters} sélectionné(s) sur 4</div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn outline" id="mastersMinus" style="padding:6px 12px;">−</button>
      <button class="btn outline" id="mastersPlus" style="padding:6px 12px;">+</button>
    </div>`;
  bigWrap.appendChild(mCard);
  document.getElementById('mastersMinus').onclick = ()=>{ calendarChoice.masters = Math.max(0, calendarChoice.masters-1); renderCalendarPhase(); };
  document.getElementById('mastersPlus').onclick = ()=>{ calendarChoice.masters = Math.min(4, calendarChoice.masters+1); renderCalendarPhase(); };

  const retireBtn = document.getElementById('retireBtn');
  if(retireBtn){ retireBtn.onclick = ()=>{ p.retired = true; render(); }; }

  document.getElementById('launchSeasonBtn').onclick = ()=>{
    const choice = calendarChoice;
    calendarChoice = null;
    startSeason(p, choice);
  };
}

  app.innerHTML = `

        <div>
          <div class="brand-name">Set Point</div>
          <div class="brand-sub">${p.forcedRetire ? 'Fin de carrière forcée' : 'Retraite annoncée'} · ${p.seasonsPlayed} saisons</div>
        </div>
      </div>
      <div class="rank-box">
        <span class="rank-lbl">Meilleur classement</span>
        <span class="rank-num mono">#${p.bestRank}</span>

    <div class="card">

        <div class="rating-bg">${TROPHY_ICON(120)}</div>

      <div class="recap-row"><span class="l">Titres Masters 1000</span><span class="r">${p.titles.masters}</span></div>
      <div class="recap-row"><span class="l">Titres ATP 500</span><span class="r">${p.titles.atp500}</span></div>
      <div class="recap-row"><span class="l">Titres ATP 250</span><span class="r">${p.titles.atp250}</span></div>

      <div class="recap-row"><span class="l">Gains cumulés</span><span class="r gold">${eur(p.money)}</span></div>
      <div class="recap-row"><span class="l">Blessures</span><span class="r ${p.injuries.length?'bad':''}">${p.injuries.length}</span></div>
      <div class="recap-row"><span class="l">Retraite à</span><span class="r">${p.age} ans</span></div>

      <div class="eyebrow" style="margin-top:20px;">Badges</div>
      <div class="badges">${badges.map(b=>`<div class="badge"><div class="h">${b.h}</div><div class="d">${b.d}</div></div>`).join('')}</div>

      <div class="actions"><button class="btn" onclick="player=null; render()">Rejouer une carrière</button></div>

render();
