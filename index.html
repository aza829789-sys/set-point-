<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Point — ta carrière de tennis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F8F0;
  --surface:#FFFFFF;
  --ink:#132A1D;
  --muted:#647B6C;
  --line:#DDE7D9;
  --ball:#CFEA3E;
  --ball-dark:#AECC2A;
  --clay:#D4632B;
  --net:#153452;
  --gold:#D9A441;
  --red:#D14B3E;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter', sans-serif;
  min-height:100vh;
  padding:24px 16px 60px;
  background-image:
    radial-gradient(circle at 100% 0%, rgba(207,234,62,0.16), transparent 45%),
    radial-gradient(circle at 0% 100%, rgba(21,52,82,0.05), transparent 40%);
  transition: background-color 0.4s ease;
}
h1,h2,h3,.heading{font-family:'Poppins', sans-serif;}
.mono{font-family:'Space Mono', monospace;}
.wrap{max-width:960px; margin:0 auto;}

.icon-ball{display:inline-block; vertical-align:middle;}
.court-divider{
  width:100%; height:14px; margin:18px 0;
  background-image:repeating-linear-gradient(90deg, var(--line) 0 22px, transparent 22px 34px);
  background-position:center;
  background-repeat:repeat-x;
  background-size:34px 2px;
  background-position-y:6px;
}

.topbar{
  background:var(--net);
  border-radius:16px;
  padding:20px 24px;
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  margin-bottom:20px;
  color:#fff;
  position:relative;
  overflow:hidden;
  transition: background 0.4s ease;
}
.topbar::after{
  content:"";
  position:absolute; right:-30px; top:-30px; width:140px; height:140px; border-radius:50%;
  background:radial-gradient(circle, rgba(207,234,62,0.25), transparent 70%);
}
.topbar .brand{display:flex; align-items:center; gap:10px;}
.topbar .brand-name{font-size:20px; font-weight:700; letter-spacing:-0.01em;}
.topbar .brand-sub{font-size:12px; color:#B9C9D6; margin-top:1px;}
.topbar .rank-box{display:flex; align-items:baseline; gap:8px;}
.topbar .rank-lbl{font-size:11px; color:#B9C9D6; text-transform:uppercase; letter-spacing:0.08em;}
.topbar .rank-num{font-size:32px; font-weight:700; color:var(--ball);}
.topbar .rank-delta{font-size:13px;}
.rank-delta.up{color:var(--ball);}
.rank-delta.down{color:#F0897C;}
.rank-delta.flat{color:#B9C9D6;}

.grid{display:grid; grid-template-columns:270px 1fr; gap:16px;}
@media(max-width:740px){.grid{grid-template-columns:1fr;}}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  box-shadow:0 1px 0 rgba(19,42,29,0.02);
  transition: background 0.4s ease, border-color 0.4s ease;
}
.card + .card{margin-top:16px;}

.player-name{font-size:19px; font-weight:700;}
.player-sub{font-size:12.5px; color:var(--muted); margin-bottom:16px;}
.stat{margin-bottom:10px;}
.stat-top{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:4px;}
.stat-top b{color:var(--ink); font-weight:600;}
.stat-bar{height:7px; background:#EEF3EA; border-radius:4px; overflow:hidden;}
.stat-bar > span{display:block; height:100%; background:var(--net); border-radius:4px;}
.stat-bar.form > span{background:var(--gold);}
.stat-bar.morale > span{background:#5B9BD1;}

.money-line{display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); font-size:13px;}
.money-line .v{font-weight:700; color:var(--clay);}

.badge-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;}
.badge-row span{font-size:11px; padding:4px 8px; border-radius:20px; background:#EEF3EA; color:var(--muted); font-weight:500;}
.badge-row span.has{background:var(--ball); color:var(--ink);}

.eyebrow{font-size:12px; color:var(--clay); font-weight:600; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px;}
.stage-h{font-size:22px; font-weight:700; margin-bottom:10px;}
.stage-p{font-size:15.5px; line-height:1.6; color:#37493D; margin-bottom:18px;}

.choices{display:flex; flex-direction:column; gap:10px;}
.choice{
  text-align:left; background:#F9FBF7; border:1.5px solid var(--line); border-radius:12px;
  padding:14px 16px; cursor:pointer; font-family:'Inter',sans-serif; font-size:14.5px; color:var(--ink);
  transition:border-color .12s ease, background .12s ease;
}
.choice:hover{border-color:var(--ball-dark); background:#F4FADF;}
.choice .tag{display:block; font-size:11px; font-weight:700; color:var(--net); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px;}
.choice .desc{display:block; font-size:12.5px; color:var(--muted); margin-top:4px;}

.btn{
  font-family:'Poppins',sans-serif; font-weight:600; font-size:14px;
  background:var(--ball); color:var(--ink); border:none; border-radius:10px;
  padding:13px 22px; cursor:pointer;
}
.btn:hover{background:var(--ball-dark);}
.btn.outline{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
.btn.outline:hover{border-color:var(--net);}
.btn.danger{background:var(--red); color:#fff;}

.recap-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:14px;}
.recap-row:last-child{border:none;}
.recap-row .l{color:var(--muted); font-size:12.5px;}
.recap-row .r{font-weight:700;}
.recap-row .r.gold{color:var(--gold);}
.recap-row .r.bad{color:var(--red);}
.recap-row .r.good{color:#4E8C3F;}

.results{display:flex; flex-direction:column; gap:6px; margin:14px 0 18px;}
.result{
  display:flex; justify-content:space-between; font-size:12.5px; padding:8px 10px;
  background:#F9FBF7; border-radius:8px; border-left:3px solid var(--line);
}
.result.title{border-left-color:var(--gold); background:#FBF4E4; font-weight:600;}

.journal{max-height:210px; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:8px;}
.journal-item{font-size:12.5px; color:var(--muted); padding-left:10px; border-left:2px solid var(--line);}
.journal-item b{color:var(--ink);}
.journal::-webkit-scrollbar{width:5px;}
.journal::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

.hero{text-align:center; padding:50px 10px 20px;}
.hero .ball-hero{margin-bottom:18px;}
.hero h1{font-size:44px; font-weight:800; margin-bottom:14px; line-height:1.05;}
.hero h1 span{color:var(--clay);}
.hero p{max-width:520px; margin:0 auto 26px; color:#37493D; font-size:16px; line-height:1.6;}

.field{margin-bottom:18px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.04em;}
.field input[type=text]{
  width:100%; background:#F9FBF7; border:1.5px solid var(--line); color:var(--ink);
  padding:12px 14px; border-radius:10px; font-family:'Inter',sans-serif; font-size:15px;
}
.field input[type=text]:focus{outline:none; border-color:var(--ball-dark);}
.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:520px){.opt-grid{grid-template-columns:1fr;}}
.opt{background:#F9FBF7; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer;}
.opt .h{font-weight:600; font-size:13.5px; margin-bottom:3px;}
.opt .d{font-size:12px; color:var(--muted); line-height:1.4;}
.opt.sel{border-color:var(--ball-dark); background:#F4FADF;}
.opt.sel .h{color:var(--net);}

.rating{
  text-align:center; padding:24px 10px; margin-bottom:20px; background:#F9FBF7;
  border:1px solid var(--line); border-radius:16px;
}
.rating .letter{font-size:74px; font-weight:800; color:var(--gold); line-height:1;}
.rating .flavor{font-size:14.5px; margin-top:6px;}
.rating .score{font-size:12px; color:var(--muted); margin-top:5px;}

.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin:14px 0 20px;}
.badge{background:#F9FBF7; border:1px solid var(--line); border-radius:10px; padding:12px 14px;}
.badge .h{font-weight:600; font-size:13px; color:var(--net); margin-bottom:3px;}
.badge .d{font-size:11.5px; color:var(--muted); line-height:1.4;}

.actions{display:flex; gap:12px; margin-top:20px; flex-wrap:wrap;}
.creation-progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 24px}.creation-progress span{height:4px;background:var(--line);border-radius:5px}.creation-progress span.on{background:var(--ball)}
.footer-note{text-align:center; color:var(--muted); font-size:11.5px; margin-top:32px;}

html,body{width:100%;max-width:100%;overflow-x:hidden}
*{box-sizing:border-box}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
img,svg,canvas{max-width:100%}
@media(max-width:740px){
  body{padding:8px 8px 24px}
  .wrap{width:100%;max-width:100%}
  .topbar{padding:12px 13px;margin-bottom:9px;min-height:56px}
  .topbar .brand-name{font-size:17px}
  .topbar .brand-sub{font-size:9px}
  .topbar .rank-num{font-size:22px}
  .topbar .rank-lbl{font-size:9px}
  .topbar .rank-delta{font-size:10px}
  .grid{grid-template-columns:1fr;gap:9px}
  .card{padding:15px;border-radius:13px;min-width:0}
  .stage-h{font-size:20px}
  .stage-p{font-size:13px;line-height:1.45;overflow-wrap:anywhere}
  .choice{width:100%;padding:12px;border-radius:11px}
  .choice .desc{font-size:11px;line-height:1.35}
  .choice .tag{font-size:9px}
  .actions{display:flex;flex-wrap:wrap;gap:8px}
  .btn{padding:11px 14px}
  .opt-grid{grid-template-columns:1fr 1fr;gap:7px}
  .opt{padding:10px;border-radius:9px}
  .opt .h{font-size:12px}.opt .d{font-size:10px;line-height:1.3}
  .creation-progress{margin-bottom:17px}
  .creation-progress span{height:4px}
  .field input[type=text]{width:100%;font-size:16px}
  .hero{padding:30px 8px 12px}
  .hero h1{font-size:40px}
  .hero p{font-size:14px;line-height:1.5}
  .badges{grid-template-columns:1fr}
}
@media(max-width:390px){
  .opt-grid{grid-template-columns:1fr}
  .topbar .rank-delta{display:none}
  .stage-h{font-size:19px}
}
@media(min-width:741px){
  body{padding:24px 18px 60px}
  .wrap{max-width:1040px}
  .grid{grid-template-columns:280px minmax(0,1fr);align-items:start}
  .card{min-width:0}
}

.decision-gain{margin:0 0 14px;padding:12px 14px;border:1px solid #dfe7df;border-radius:12px;background:#f7faf7}
.decision-gain b{font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.gain-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gain{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}
.gain.up{background:#e5f4e8;color:#17652b}.gain.down{background:#fae7e7;color:#8d2525}.gain.neutral{background:#edf0ed;color:#536057}

.choice.sel{border-color:var(--ball-dark); background:#F4FADF;}
.tourn-banner{padding:14px 16px;border-radius:12px;color:#fff;}
.tourn-banner-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;}
.tourn-banner-sub{font-size:12px;opacity:.85;margin-top:2px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============ OUTILS ============ */
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const choose = (arr) => arr[rand(0, arr.length - 1)];
const eur = (v) => v.toLocaleString('fr-FR') + ' €';

const BALL_ICON = (size=28) => `<svg class="icon-ball" width="${size}" height="${size}" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
<circle cx="20" cy="20" r="18" fill="#CFEA3E" stroke="#132A1D" stroke-width="1.5"/>
<path d="M4 12C10 18 10 22 4 28" stroke="#132A1D" stroke-width="1.5" fill="none"/>
<path d="M36 12C30 18 30 22 36 28" stroke="#132A1D" stroke-width="1.5" fill="none"/>
</svg>`;

/* ============ DONNÉES ============ */
const NATIONS = [
  { id:'fr', label:'France', slam:'Roland-Garros' },
  { id:'uk', label:'Angleterre', slam:'Wimbledon' },
  { id:'us', label:'États-Unis', slam:'US Open' },
  { id:'au', label:'Australie', slam:'Open d\'Australie' },
  { id:'es', label:'Espagne', slam:null },
  { id:'sr', label:'Serbie', slam:null },
  { id:'ar', label:'Argentine', slam:null },
  { id:'ma', label:'Maroc', slam:null },
  { id:'jp', label:'Japon', slam:null },
  { id:'it', label:'Italie', slam:null },
];

const STYLES = [
  { id:'fond', label:'Fond de court', desc:'Endurant, régulier, patient.', mod:{mental:8, physique:5, service:-3, technique:0} },
  { id:'sv', label:'Service-volée', desc:'Rapide au filet, style rare.', mod:{service:10, technique:4, physique:-4, mental:-2} },
  { id:'poly', label:'Polyvalent', desc:'À l\'aise partout, sans excès.', mod:{technique:4, service:4, physique:4, mental:4} },
  { id:'cogneur', label:'Cogneur', desc:'Frappe fort, prend des risques.', mod:{service:8, technique:6, mental:-6, physique:-2} },
];

const BACKGROUNDS = [
  { id:'academie', label:'Académie', desc:'Formation d\'élite, mais chère.', mod:{technique:10, service:4, mental:-4}, money:5000, rep:15 },
  { id:'famille', label:'Coach familial', desc:'Un proche vous a tout appris.', mod:{mental:8, technique:3}, money:2000, rep:5 },
  { id:'muni', label:'Cours municipaux', desc:'Parti de rien, forgé sur le tas.', mod:{physique:10, mental:6, technique:-8, service:-4}, money:500, rep:0 },
];

const TIERS = {
  challenger:{ label:'Challenger', baseOpp:27, oppInc:4, points:[5,12,25,45,80], prize:[400,900,2000,4200,9000], energyCost:6 },
  atp250:{ label:'ATP 250', baseOpp:39, oppInc:4, points:[8,16,30,55,105,170], prize:[3000,6000,12000,25000,55000,120000], energyCost:8 },
  atp500:{ label:'ATP 500', baseOpp:49, oppInc:4, points:[8,16,35,70,140,250], prize:[6000,12000,25000,50000,110000,250000], energyCost:9 },
  masters:{ label:'Masters 1000', baseOpp:59, oppInc:4, points:[10,20,45,90,180,360], prize:[15000,30000,60000,120000,250000,500000], energyCost:11 },
  slam:{ label:'Grand Chelem', baseOpp:67, oppInc:4, points:[10,45,90,180,360,720,1200], prize:[60000,120000,220000,400000,700000,1300000,2400000], energyCost:13 }
};

/* Identité et couleurs des 4 levées du Grand Chelem */
const SLAMS = [
  { id:'ao', label:'Open d\'Australie', surface:'Dur', place:'Melbourne', week:4, colors:{ bg:'#EAF2FB', surface:'#FFFFFF', ink:'#0F294A', net:'#1B4B8C', clay:'#1B4B8C', line:'#C6D9EF', ball:'#4F8FDB', ball-dark:'#356EA8' } },
  { id:'rg', label:'Roland-Garros', surface:'Terre battue', place:'Paris', week:22, colors:{ bg:'#FBEEE3', surface:'#FFFFFF', ink:'#3D1E12', net:'#C1592A', clay:'#C1592A', line:'#EED4C3', ball:'#D4632B', ball-dark:'#A84B1F' } },
  { id:'wim', label:'Wimbledon', surface:'Gazon', place:'Londres', week:29, colors:{ bg:'#E7F3EB', surface:'#FFFFFF', ink:'#0F3621', net:'#1B5E3A', clay:'#1B5E3A', line:'#C7E5D1', ball:'#2E8B57', ball-dark:'#1F5E3A' } },
  { id:'uso', label:'US Open', surface:'Dur', place:'New York', week:38, colors:{ bg:'#EAEBFB', surface:'#FFFFFF', ink:'#141B4A', net:'#25348C', clay:'#25348C', line:'#CBCEEF', ball:'#5566C7', ball-dark:'#3E4C9C' } },
];

const TIER_COLORS = {
  challenger:{ bg:'#F3F8F0', surface:'#FFFFFF', ink:'#132A1D', net:'#153452', clay:'#D4632B', line:'#DDE7D9', ball:'#CFEA3E' },
  atp250:{ bg:'#F0F5F8', surface:'#FFFFFF', ink:'#13222A', net:'#1E4663', clay:'#2B74D4', line:'#D6E3EC', ball:'#5B95BE' },
  atp500:{ bg:'#EEF3F6', surface:'#FFFFFF', ink:'#11202A', net:'#224F6B', clay:'#2B68D4', line:'#D2E1EC', ball:'#4B879F' },
  masters:{ bg:'#F4F0F8', surface:'#FFFFFF', ink:'#20132A', net:'#411E63', clay:'#7A2BD4', line:'#E4D6EC', ball:'#8B67B8' },
};

function applyTheme(tierId, slamId){
  let c = TIER_COLORS[tierId] || TIER_COLORS.challenger;
  if(tierId === 'slam'){
    const s = SLAMS.find(x => x.id === slamId);
    if(s) c = s.colors;
  }
  const root = document.documentElement;
  root.style.setProperty('--bg', c.bg);
  root.style.setProperty('--surface', c.surface);
  root.style.setProperty('--ink', c.ink);
  root.style.setProperty('--net', c.net);
  root.style.setProperty('--clay', c.clay);
  root.style.setProperty('--line', c.line);
  root.style.setProperty('--ball', c.ball);
}

function tournamentLabel(tierId, slamId){
  if(tierId==='slam'){ const s = SLAMS.find(x=>x.id===slamId); return s ? s.label : 'Grand Chelem'; }
  return TIERS[tierId].label;
}
function tournamentSurface(tierId, slamId){
  if(tierId==='slam'){ const s = SLAMS.find(x=>x.id===slamId); return s ? (s.surface + ' · ' + s.place) : ''; }
  if(tierId==='masters') return 'Grand rendez-vous du circuit';
  return 'Circuit international';
}

/* Tactiques diversifiées et contextuelles en demi-finale et finale */
const SF_TACTICS = [
  { id:'sf_safe', label:'Sécuriser les longs échanges', tag:'Patience', desc:'Fatigue réduite, vous poussez l’adversaire à la faute.', probMod:-0.03, energyMod:-2 },
  { id:'sf_attack', label:'Prendre le filet d’assaut', tag:'Offensive', desc:'Risqué mais surprend l’adversaire en fin de tournoi.', probMod:0.06, energyMod:4 },
  { id:'sf_tempo', label:'Briser le rythme (amorties & slices)', tag:'Variations', desc:'Perturbe la cadence adverse sans puiser dans vos réserves.', probMod:0.02, energyMod:1 }
];

const FIN_TACTICS = [
  { id:'fin_clutch', label:'Jouer au plus près des lignes', tag:'Culot maximal', desc:'Vous tentez des coups de génie sous pression.', probMod:0.08, energyMod:6 },
  { id:'fin_solid', label:'Tenir solidement sa mise en jeu', tag:'Maîtrise', desc:'Vous misez sur la solidité de votre service.', probMod:0.03, energyMod:2 },
  { id:'fin_psych', label:'Jouer l’épreuve de force mentale', tag:'Intimidation', desc:'Vous poussez l’adversaire à gamberger dans sa tête.', probMod:0.05, energyMod:3 }
];

const RANK_BANDS = [
  [9200, 1], [7500, 5], [6000, 12], [4600, 22], [3400, 40],
  [2400, 65], [1600, 100], [1000, 160], [600, 260], [320, 420],
  [150, 650], [50, 900], [0, 1400]
];

function snapshotStats(p){
  return {technique:p.stats.technique,service:p.stats.service,physique:p.stats.physique,mental:p.stats.mental,morale:p.morale,energy:p.energy,rep:p.rep,money:p.money};
}

function pointsToRank(points){
  for(let i=0;i<RANK_BANDS.length;i++){
    const [threshold, rankAtThreshold] = RANK_BANDS[i];
    if(points >= threshold){
      if(i===0) return rankAtThreshold;
      const [prevThreshold, prevRank] = RANK_BANDS[i-1];
      const span = prevThreshold - threshold;
      const frac = span<=0 ? 0 : (points - threshold) / span;
      return Math.max(1, Math.round(rankAtThreshold - frac*(rankAtThreshold - prevRank)));
    }
  }
  return 1400;
}

const FUNNY_EVENTS = [
  {id:'funny_cat',min:16,max:24,title:'Un chat envahit le court',text:'Un chat s’installe sur la ligne de fond. Il refuse catégoriquement de bouger.',choices:[
    {label:'Attendre',tag:'Fair-play',desc:'Le chat finit par partir.',effect:p=>{p.morale=clamp(p.morale+4,0,100);log(p,'Un chat a interrompu votre entraînement.');}},
    {label:'Jouer autour',tag:'Concentration',desc:'Vous apprenez à viser entre les moustaches.',effect:p=>{p.stats.mental+=2;log(p,'Vous avez joué avec un chat comme arbitre.');}}
  ]},
  {id:'funny_ballboy',min:16,max:25,title:'Le ramasseur superstar',text:'Un ramasseur renvoie une balle avec un effet si étrange que tout le monde applaudit.',choices:[
    {label:'Le féliciter',tag:'Classe',desc:'Une petite vidéo devient virale.',effect:p=>{p.rep=clamp(p.rep+4,0,100);p.morale=clamp(p.morale+3,0,100);log(p,'Un ramasseur est devenu la star du jour.');}},
    {label:'Demander le secret',tag:'Technique',desc:'Il répond : « Je lance juste fort. »',effect:p=>{p.stats.technique+=2;log(p,'Vous avez reçu un conseil technique improbable.');}}
  ]},
  {id:'funny_banana',min:16,max:26,title:'La banane officielle',text:'Un spectateur vous tend une banane pendant l’échauffement comme si c’était un trophée.',choices:[

/* ============ MOTEUR DE RENDU ============ */
function render(){
  const app = document.getElementById('app');
  if(!app) return;

  // S'assurer que le thème par défaut s'applique hors tournoi
  if(state.screen !== 'tournament'){
    applyTheme('challenger', null);
  }

  let html = '';
  switch(state.screen){
    case 'welcome': html = renderWelcome(); break;
    case 'creation': html = renderCreation(); break;
    case 'hub': html = renderHub(); break;
    case 'slam_prompt': html = renderSlamPrompt(); break;
    case 'tournament': html = renderTournament(); break;
    case 'event': html = renderEvent(); break;
    case 'end': html = renderEnd(); break;
  }
  app.innerHTML = html;
}

    `).join('');
    stepContent = `
      <div class="stage-h">Ton style de jeu</div>

    stepContent = `
      <div class="stage-h">Prêt à entrer sur le court ?</div>

function nextCreationStep(step){
  if(step === 1){
    const inp = document.getElementById('playerNameInput');
    if(inp && inp.value.trim()){
      state.player.name = inp.value.trim();
    } else {
      state.player.name = 'Arthur Vant';
    }
  }
  state.creationStep++;
  render();
}
function prevCreationStep(){
  if(state.creationStep > 1) state.creationStep--;
  render();
}
function selectNation(id){ state.player.nation = id; render(); }
function selectStyle(id){ state.player.style = id; render(); }
function selectBg(id){ state.player.bg = id; render(); }

function finalizeCreation(){
  const p = state.player;
  const s = STYLES.find(x=>x.id===p.style) || STYLES[0];
  const b = BACKGROUNDS.find(x=>x.id===p.bg) || BACKGROUNDS[0];

  p.stats.technique = clamp(45 + (s.mod.technique||0) + (b.mod.technique||0), 20, 95);
  p.stats.service = clamp(45 + (s.mod.service||0) + (b.mod.service||0), 20, 95);
  p.stats.physique = clamp(45 + (s.mod.physique||0) + (b.mod.physique||0), 20, 95);
  p.stats.mental = clamp(45 + (s.mod.mental||0) + (b.mod.mental||0), 20, 95);

  p.money = b.money;
  p.rep = b.rep;
  p.points = 0;
  p.rank = pointsToRank(0);
  p.prevRank = p.rank;

  state.calendar.week = 1;
  state.calendar.year = 2026;
  state.screen = 'hub';
  log(p, 'Début de la carrière professionnelle à 16 ans.');
  render();
}

function checkSlamTrigger(){
  const w = state.calendar.week;

  // Condition de qualification : Top 64 mondial
  if(state.player.rank <= 64){
    state.calendar.currentSlamOffer = slam;
    state.screen = 'slam_prompt';
    return true;

}

/* --- GESTION DES TOURNOIS --- */
function startTourn(tierId, slamId = null){
  const p = state.player;
  const tConf = TIERS[tierId];

  // Vérifications d'accès
  if(tierId === 'atp250' && p.rank > 250){ log(p, 'Classement insuffisant pour l’ATP 250.'); render(); return; }
  if(tierId === 'atp500' && p.rank > 80){ log(p, 'Classement insuffisant pour l’ATP 500.'); render(); return; }
  if(tierId === 'masters' && p.rank > 30){ log(p, 'Classement insuffisant pour le Masters 1000.'); render(); return; }
  if(tierId === 'slam' && p.rank > 64){ log(p, 'Classement insuffisant pour le Grand Chelem.'); render(); return; }

  if(p.energy < tConf.energyCost){
    log(p, 'Pas assez d’énergie pour disputer ce tournoi ! Reposez-vous.');
    render();
    return;
  }

  p.energy = clamp(p.energy - tConf.energyCost, 0, 100);

  state.tournament = {
    tier: tierId,
    slamId: slamId,
    roundIdx: 0,
    opponent: null,
    history: [],
    stage: 'hub',
    tactic: null
  };

  applyTheme(tierId, slamId);
  state.screen = 'tournament';
  generateOpponent();
  render();
}

function generateOpponent(){
  const t = state.tournament;
  const tConf = TIERS[t.tier];
  const oppRating = Math.max(15, Math.round(tConf.baseOpp + t.roundIdx * tConf.oppInc + (Math.random()*8 - 4)));
  t.opponent = {
    name: generateOpponentName(),
    rating: oppRating
  };
}

function generateOpponentName(){
  const firsts = ['Lucas','Matteo','Carlos','Jannik','Alexander','Daniil','Stefanos','Andrey','Taylor','Casper','Alex','Ben','Ugo','Arthur','Felix','Sebastian','Holger','Karen','Frances','Tommy'];
  const lasts = ['Alcaraz','Sinner','Djokovic','Medvedev','Zverev','Ruud','Tsitsipas','Rublev','Fritz','De Minaur','Humbert','Rinderknech','Fils','Cerundolo','Paul','Shelton','Musetti','Draper','Korda','Bublik'];
  return choose(firsts) + ' ' + choose(lasts);
}

function renderTournament(){
  const t = state.tournament;
  const p = state.player;
  const tConf = TIERS[t.tier];
  const totalRounds = tConf.points.length;
  const isFinalRound = (t.roundIdx === totalRounds - 1);
  const isSemiRound = (t.roundIdx === totalRounds - 2);

  const tName = tournamentLabel(t.tier, t.slamId);
  const tSurf = tournamentSurface(t.tier, t.slamId);

  let content = '';

  if(t.stage === 'hub'){
    content = `
      <div class="tourn-banner" style="background:var(--net); margin-bottom:16px;">
        <div class="tourn-banner-name">${tName}</div>
        <div class="tourn-banner-sub">${tSurf} · Tour ${t.roundIdx + 1} / ${totalRounds}</div>
      </div>
      <div class="stage-h">Prochain adversaire : ${t.opponent.name}</div>
      <div class="stage-p">
        Niveau estimé de l’adversaire : <b>${t.opponent.rating} / 100</b>.<br>
        Préparez votre tactique pour remporter ce match crucial.
      </div>
      <div class="actions">
        <button class="btn" onclick="playMatch()">Jouer le match</button>
        <button class="btn danger" onclick="withdrawTourn()">Déclarer forfait</button>
      </div>
    `;
  } else if(t.stage === 'match_choices'){
    let tacticsList = SF_TACTICS;
    let stageTitle = 'Demi-finale intense';
    let stageDesc = 'Le dernier carré ! Choisissez votre approche tactique pour faire basculer ce match décisif :';

    if(isFinalRound){
      tacticsList = FIN_TACTICS;
      stageTitle = 'Finale du tournoi !';
      stageDesc = 'Le trophée est à portée de main. Choisissez votre plan de jeu final :';
    } else if(!isSemiRound){
      // Tour standard, résolution automatique ou transition rapide
      playMatchResolution(null);
      return '';
    }

    content = `
      <div class="tourn-banner" style="background:var(--net); margin-bottom:16px;">
        <div class="tourn-banner-name">${tName} — ${stageTitle}</div>
        <div class="tourn-banner-sub">Adversaire : ${t.opponent.name}</div>
      </div>
      <div class="stage-h">${stageTitle}</div>
      <div class="stage-p">${stageDesc}</div>
      <div class="choices">
        ${tacticsList.map(tac=>`
          <button class="choice" onclick="playMatchResolution('${tac.id}')">
            <span class="tag">${tac.tag}</span>
            <b>${tac.label}</b>
            <span class="desc">${tac.desc}</span>
          </button>
        `).join('')}
      </div>
    `;
  } else if(t.stage === 'result'){
    let resultsHtml = t.history.map(h=>`<div class="result ${h.won&&h.isFinal?'title':''}"><span>${h.text}</span><b>${h.won?'Victoire':'Défaite'}</b></div>`).join('');
    content = `
      <div class="tourn-banner" style="background:var(--net); margin-bottom:16px;">
        <div class="tourn-banner-name">${tName}</div>
        <div class="tourn-banner-sub">Bilan du tournoi</div>
      </div>
      <div class="stage-h">Résultats du tournoi</div>
      <div class="results">${resultsHtml}</div>
      <button class="btn" onclick="finishTournament()">Continuer</button>
    `;
  }

  return `<div class="card">${content}</div>`;
}

function playMatch(){
  const t = state.tournament;
  const tConf = TIERS[t.tier];
  const totalRounds = tConf.points.length;
  const isSemiRound = (t.roundIdx === totalRounds - 2);
  const isFinalRound = (t.roundIdx === totalRounds - 1);

  if(isSemiRound || isFinalRound){
    t.stage = 'match_choices';
    render();
  } else {
    playMatchResolution(null);
  }
}

function playMatchResolution(tacticId){
  const p = state.player;
  const t = state.tournament;
  const tConf = TIERS[t.tier];

  let probMod = 0;
  let energyCost = 3;

  if(tacticId){
    const allTac = [...SF_TACTICS, ...FIN_TACTICS];
    const found = allTac.find(x=>x.id===tacticId);
    if(found){
      probMod = found.probMod;
      energyCost = Math.max(1, 3 + (found.energyMod || 0));
    }
  }

  p.energy = clamp(p.energy - energyCost, 0, 100);

  // Calcul de performance du joueur
  const playerPower = (p.stats.technique * 0.3) + (p.stats.service * 0.25) + (p.stats.physique * 0.25) + (p.stats.mental * 0.2) + (p.morale * 0.1) + (Math.random() * 20 - 10) + (probMod * 100);
  const oppPower = t.opponent.rating + (Math.random() * 25 - 12);

  const won = playerPower >= oppPower;
  const isFinal = (t.roundIdx === tConf.points.length - 1);

  t.history.push({
    round: t.roundIdx + 1,
    opponent: t.opponent.name,
    won,
    isFinal,
    text: `Tour ${t.roundIdx + 1} vs ${t.opponent.name}`
  });

  if(won){
    if(isFinal){
      // Victoire finale du tournoi !
      const pts = tConf.points[t.roundIdx];
      const prz = tConf.prize[t.roundIdx];
      p.points += pts;
      p.money += prz;
      p.rep = clamp(p.rep + 8, 0, 100);

      if(t.tier === 'slam'){
        p.titles.slam++;
        log(p, `🏆 Victoire historique au ${tournamentLabel(t.tier, t.slamId)} ! (+${pts} pts, +${eur(prz)})`);
      } else if(t.tier === 'masters'){
        p.titles.masters++;
        log(p, `🏆 Victoire au Masters 1000 ! (+${pts} pts, +${eur(prz)})`);
      } else if(t.tier === 'atp500'){
        p.titles.atp500++;
        log(p, `🥇 Titre ATP 500 remporté ! (+${pts} pts, +${eur(prz)})`);
      } else if(t.tier === 'atp250'){
        p.titles.atp250++;
        log(p, `🥇 Titre ATP 250 remporté ! (+${pts} pts, +${eur(prz)})`);
      } else {
        p.titles.challenger++;
        log(p, `🥇 Titre Challenger remporté ! (+${pts} pts, +${eur(prz)})`);
      }

      t.stage = 'result';
      render();
    } else {
      // Victoire de tour standard / intermédiaire
      t.roundIdx++;
      generateOpponent();
      t.stage = 'hub';
      render();
    }
  } else {
    // Défaite
    const achievedRound = t.roundIdx;
    const pts = achievedRound > 0 ? tConf.points[achievedRound - 1] : Math.round(tConf.points[0]/2);
    const prz = achievedRound > 0 ? tConf.prize[achievedRound - 1] : Math.round(tConf.prize[0]/2);
    p.points += pts;
    p.money += prz;

    log(p, `Élimination au ${tournamentLabel(t.tier, t.slamId)} au tour ${achievedRound + 1} par ${t.opponent.name}. (+${pts} pts)`);
    t.stage = 'result';
    render();
  }
}

function withdrawTourn(){
  const p = state.player;
  log(p, 'Forfait déclaré pendant le tournoi.');
  finishTournament();
}

function finishTournament(){
  updateRanking();
  advanceWeek();
}

/* --- ENTRAÎNEMENT ET REPOS --- */
function doTraining(){
  const p = state.player;
  if(p.energy < 12){
    log(p, 'Trop fatigué pour vous entraîner. Reposez-vous !');
    render();
    return;
  }
  p.energy = clamp(p.energy - 12, 0, 100);
  
  // Amélioration aléatoire d'une stat
  const statsList = ['technique','service','physique','mental'];
  const chosenStat = choose(statsList);
  p.stats[chosenStat] = clamp(p.stats[chosenStat] + rand(1, 3), 20, 99);
  
  log(p, `Séance d'entraînement réussie : +${chosenStat.toUpperCase()} amélioré.`);
  updateRanking();
  advanceWeek();
}

function doRest(){
  const p = state.player;
  p.energy = clamp(p.energy + 25, 0, 100);
  p.morale = clamp(p.morale + 5, 0, 100);
  log(p, 'Semaine de repos et récupération bénéfique.');
  updateRanking();
  advanceWeek();
}

function updateRanking(){
  const p = state.player;
  p.prevRank = p.rank;
  p.rank = pointsToRank(p.points);
}

/* --- PROGRESSION DU CALENDRIER --- */
function advanceWeek(){
  const p = state.player;
  state.calendar.week++;

  // Événement aléatoire ou fun occasionnel
  if(Math.random() < 0.35 && state.calendar.week % 2 === 0){
    triggerRandomEvent();
    return;
  }

  // Fin d'année civile (48 semaines)
  if(state.calendar.week > 48){
    state.calendar.week = 1;
    state.calendar.year++;
    p.age++;
    log(p, `Bon anniversaire ! Vous avez désormais ${p.age} ans.`);

    if(p.age >= 36 || p.money <= -10000){
      state.screen = 'end';
      render();
      return;
    }
  }

  // Vérifier si un Grand Chelem se déclenche cette semaine
  if(checkSlamTrigger()){
    render();
    return;
  }

  state.screen = 'hub';
  render();
}

/* --- ÉVÉNEMENTS ALÉATOIRES --- */
let activeEvent = null;

function triggerRandomEvent(){
  activeEvent = choose(FUNNY_EVENTS);
  state.screen = 'event';
  render();
}

function renderEvent(){
  const ev = activeEvent;
  if(!ev){ state.screen = 'hub'; render(); return; }

  return `
    <div class="card">
      <div class="eyebrow">Événement imprévu</div>
      <div class="stage-h">${ev.title}</div>
      <div class="stage-p">${ev.text}</div>
      <div class="choices">
        ${ev.choices.map((c, idx)=>`
          <button class="choice" onclick="resolveEventChoice(${idx})">
            <span class="tag">${c.tag}</span>
            <b>${c.label}</b>
            <span class="desc">${c.desc}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function resolveEventChoice(idx){
  const ev = activeEvent;
  if(ev && ev.choices[idx]){
    ev.choices[idx].effect(state.player);
  }
  activeEvent = null;
  updateRanking();
  state.screen = 'hub';
  render();
}

/* --- ÉCRAN FINAL (BILAN) CORRIGÉ --- */
function renderEnd(){
  applyTheme('challenger', null);
  const p = state.player;
  const totalTitles = p.titles.slam + p.titles.masters + p.titles.atp500 + p.titles.atp250 + p.titles.challenger;
  
  let goatScore = (p.titles.slam * 50) + (p.titles.masters * 20) + (p.titles.atp500 * 8) + (totalTitles * 3);
  let ratingLetter = 'B';
  let flavor = 'Une solide carrière sur le circuit professionnel.';
  if(goatScore > 400){ ratingLetter = 'GOAT'; flavor = 'Une légende incontestée de l’histoire du tennis mondial !'; }
  else if(goatScore > 250){ ratingLetter = 'A+'; flavor = 'Un champion d’exception aux palmarès immense.'; }
  else if(goatScore > 100){ ratingLetter = 'A'; flavor = 'Un joueur redouté et respecté de tous.'; }

  return `
    <div class="card">
      <div class="rating">
        <div class="letter">${ratingLetter}</div>
        <div class="flavor">${flavor}</div>
        <div class="score">Score de légende : ${goatScore} pts</div>
      </div>

      <div class="stage-h" style="text-align:center; margin-bottom:16px;">Bilan de fin de carrière</div>

      <div class="recap-row"><span class="l">Joueur</span><span class="r">${p.name}</span></div>
      <div class="recap-row"><span class="l">Âge de retraite</span><span class="r">${p.age} ans</span></div>
      <div class="recap-row"><span class="l">Titres du Grand Chelem</span><span class="r gold">${p.titles.slam}</span></div>
      <div class="recap-row"><span class="l">Titres Masters 1000</span><span class="r">${p.titles.masters}</span></div>
      <div class="recap-row"><span class="l">Titres ATP 500</span><span class="r">${p.titles.atp500}</span></div>
      <div class="recap-row"><span class="l">Titres ATP 250</span><span class="r">${p.titles.atp250}</span></div>
      <div class="recap-row"><span class="l">Titres Challenger</span><span class="r">${p.titles.challenger}</span></div>
      <div class="recap-row"><span class="l">Total de titres</span><span class="r good">${totalTitles}</span></div>
      <div class="recap-row"><span class="l">Gains cumulés</span><span class="r gold">${eur(p.money)}</span></div>
      <div class="recap-row"><span class="l">Meilleur classement</span><span class="r">Top ${p.rank}</span></div>

      <div class="actions" style="justify-content:center; margin-top:24px;">
        <button class="btn" onclick="location.reload()">Recommencer une carrière</button>
      </div>
    </div>
  `;
}

// Initialisation au chargement de la page
render();
</script>
</body>
</html>
