<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Point — ta carrière de tennis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Ambiance Roland-Garros : terre battue, lignes blanches, vert filet */
  --bg:#F2DFC7;
  --surface:#FFFCF7;
  --ink:#3B2415;
  --muted:#8A6A4E;
  --line:#E3C9A8;
  --ball:#CFEA3E;
  --ball-dark:#AECC2A;
  --clay:#B4552A;
  --net:#8A3E1F;
  --gold:#C98A2E;
  --red:#B23A2A;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter', sans-serif;
  min-height:100vh;
  padding:24px 16px 60px;
  background-image:
    radial-gradient(circle at 100% 0%, rgba(207,234,62,0.14), transparent 45%),
    radial-gradient(circle at 0% 100%, rgba(138,62,31,0.10), transparent 45%),
    repeating-linear-gradient(115deg, rgba(255,255,255,0.55) 0px, rgba(255,255,255,0.55) 2px, transparent 2px, transparent 140px),
    repeating-linear-gradient(25deg, rgba(255,255,255,0.45) 0px, rgba(255,255,255,0.45) 2px, transparent 2px, transparent 160px);
}
h1,h2,h3,.heading{font-family:'Poppins', sans-serif;}
.mono{font-family:'Space Mono', monospace;}
.wrap{max-width:960px; margin:0 auto; position:relative; z-index:1;}

#bg-court{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  display:flex; align-items:flex-start; justify-content:center;
  opacity:.16; overflow:hidden;
}
#bg-court svg{ width:min(1400px, 160vw); height:auto; margin-top:-40px; }

/* Textures de surface, posées derrière les cartes pendant les tournois */
.surface-clay{ background-image: radial-gradient(rgba(180,85,42,0.10) 1px, transparent 1.4px), radial-gradient(rgba(180,85,42,0.07) 1px, transparent 1.4px); background-size:9px 9px, 13px 13px; background-position:0 0, 4px 6px; }
.surface-grass{ background-image: repeating-linear-gradient(90deg, rgba(27,94,58,0.07) 0 10px, rgba(27,94,58,0.02) 10px 20px); }
.surface-hard{ background-image: repeating-linear-gradient(45deg, rgba(61,106,140,0.05) 0 12px, transparent 12px 24px); }

.icon-ball{display:inline-block; vertical-align:middle;}
.court-divider{
  width:100%; height:14px; margin:18px 0;
  background-image:repeating-linear-gradient(90deg, var(--line) 0 22px, transparent 22px 34px);
  background-position:center;
  background-repeat:repeat-x;
  background-size:34px 2px;
  background-position-y:6px;
}

.topbar{
  background:var(--net);
  border-radius:16px;
  padding:20px 24px;
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  margin-bottom:20px;
  color:#fff;
  position:relative;
  overflow:hidden;
}
.topbar::after{
  content:"";
  position:absolute; right:-30px; top:-30px; width:140px; height:140px; border-radius:50%;
  background:radial-gradient(circle, rgba(207,234,62,0.25), transparent 70%);
}
.topbar .brand{display:flex; align-items:center; gap:10px;}
.topbar .brand-name{font-size:20px; font-weight:700; letter-spacing:-0.01em;}
.topbar .brand-sub{font-size:12px; color:#B9C9D6; margin-top:1px;}
.topbar .rank-box{display:flex; align-items:baseline; gap:8px;}
.topbar .rank-lbl{font-size:11px; color:#B9C9D6; text-transform:uppercase; letter-spacing:0.08em;}
.topbar .rank-num{font-size:32px; font-weight:700; color:var(--ball);}
.topbar .rank-delta{font-size:13px;}
.rank-delta.up{color:var(--ball);}
.rank-delta.down{color:#F0897C;}
.rank-delta.flat{color:#B9C9D6;}

.grid{display:grid; grid-template-columns:270px 1fr; gap:16px;}
@media(max-width:740px){.grid{grid-template-columns:1fr;}}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  box-shadow:0 1px 0 rgba(19,42,29,0.02);
}
.card + .card{margin-top:16px;}

.player-name{font-size:19px; font-weight:700;}
.player-sub{font-size:12.5px; color:var(--muted); margin-bottom:16px;}
.stat{margin-bottom:10px;}
.stat-top{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:4px;}
.stat-top b{color:var(--ink); font-weight:600;}
.stat-bar{height:7px; background:#EEF3EA; border-radius:4px; overflow:hidden;}
.stat-bar > span{display:block; height:100%; background:var(--net); border-radius:4px;}
.stat-bar.form > span{background:var(--gold);}
.stat-bar.morale > span{background:#5B9BD1;}

.money-line{display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); font-size:13px;}
.money-line .v{font-weight:700; color:var(--clay);}

.badge-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;}
.badge-row span{font-size:11px; padding:4px 8px; border-radius:20px; background:#EEF3EA; color:var(--muted); font-weight:500;}
.badge-row span.has{background:var(--ball); color:var(--ink);}

.eyebrow{font-size:12px; color:var(--clay); font-weight:600; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px;}
.stage-h{font-size:22px; font-weight:700; margin-bottom:10px;}
.stage-p{font-size:15.5px; line-height:1.6; color:#37493D; margin-bottom:18px;}

.choices{display:flex; flex-direction:column; gap:10px;}
.choice{
  text-align:left; background:#F9FBF7; border:1.5px solid var(--line); border-radius:12px;
  padding:14px 16px; cursor:pointer; font-family:'Inter',sans-serif; font-size:14.5px; color:var(--ink);
  transition:border-color .12s ease, background .12s ease;
}
.choice:hover{border-color:var(--ball-dark); background:#F4FADF;}
.choice .tag{display:block; font-size:11px; font-weight:700; color:var(--net); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px;}
.choice .desc{display:block; font-size:12.5px; color:var(--muted); margin-top:4px;}

.btn{
  font-family:'Poppins',sans-serif; font-weight:600; font-size:14px;
  background:var(--ball); color:var(--ink); border:none; border-radius:10px;
  padding:13px 22px; cursor:pointer;
}
.btn:hover{background:var(--ball-dark);}
.btn.outline{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
.btn.outline:hover{border-color:var(--net);}
.btn.danger{background:var(--red); color:#fff;}

.recap-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:14px;}
.recap-row:last-child{border:none;}
.recap-row .l{color:var(--muted); font-size:12.5px;}
.recap-row .r{font-weight:700;}
.recap-row .r.gold{color:var(--gold);}
.recap-row .r.bad{color:var(--red);}
.recap-row .r.good{color:#4E8C3F;}

.results{display:flex; flex-direction:column; gap:6px; margin:14px 0 18px;}
.result{
  display:flex; justify-content:space-between; font-size:12.5px; padding:8px 10px;
  background:#F9FBF7; border-radius:8px; border-left:3px solid var(--line);
}
.result.title{border-left-color:var(--gold); background:#FBF4E4; font-weight:600;}

.journal{max-height:210px; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:8px;}
.journal-item{font-size:12.5px; color:var(--muted); padding-left:10px; border-left:2px solid var(--line);}
.journal-item b{color:var(--ink);}
.journal::-webkit-scrollbar{width:5px;}
.journal::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

.hero{text-align:center; padding:50px 10px 20px;}
.hero .ball-hero{margin-bottom:18px;}
.hero h1{font-size:44px; font-weight:800; margin-bottom:14px; line-height:1.05;}
.hero h1 span{color:var(--clay);}
.hero p{max-width:520px; margin:0 auto 26px; color:#37493D; font-size:16px; line-height:1.6;}

.field{margin-bottom:18px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.04em;}
.field input[type=text]{
  width:100%; background:#F9FBF7; border:1.5px solid var(--line); color:var(--ink);
  padding:12px 14px; border-radius:10px; font-family:'Inter',sans-serif; font-size:15px;
}
.field input[type=text]:focus{outline:none; border-color:var(--ball-dark);}
.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:520px){.opt-grid{grid-template-columns:1fr;}}
.opt{background:#F9FBF7; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer;}
.opt .h{font-weight:600; font-size:13.5px; margin-bottom:3px;}
.opt .d{font-size:12px; color:var(--muted); line-height:1.4;}
.opt.sel{border-color:var(--ball-dark); background:#F4FADF;}
.opt.sel .h{color:var(--net);}

.rating{
  text-align:center; padding:24px 10px; margin-bottom:20px; background:#F9FBF7;
  border:1px solid var(--line); border-radius:16px;
}
.rating .letter{font-size:74px; font-weight:800; color:var(--gold); line-height:1;}
.rating .flavor{font-size:14.5px; margin-top:6px;}
.rating .score{font-size:12px; color:var(--muted); margin-top:5px;}

.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin:14px 0 20px;}
.badge{background:#F9FBF7; border:1px solid var(--line); border-radius:10px; padding:12px 14px;}
.badge .h{font-weight:600; font-size:13px; color:var(--net); margin-bottom:3px;}
.badge .d{font-size:11.5px; color:var(--muted); line-height:1.4;}

.actions{display:flex; gap:12px; margin-top:20px; flex-wrap:wrap;}
.creation-progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 24px}.creation-progress span{height:4px;background:var(--line);border-radius:5px}.creation-progress span.on{background:var(--ball)}
.footer-note{text-align:center; color:var(--muted); font-size:11.5px; margin-top:32px;}


.sports-paper{background:#f4efe2;color:#191a18;border:1px solid #c9c0ad;border-radius:4px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.15);font-family:Georgia,serif}.paper-masthead{font-size:13px;letter-spacing:.16em;font-weight:800;display:flex;justify-content:space-between;gap:10px}.paper-masthead span{font-size:9px;letter-spacing:.08em}.paper-rule{border-top:4px double #222;margin:10px 0}.paper-kicker{color:var(--paper-accent);font:700 11px Inter,sans-serif;letter-spacing:.1em}.paper-grid{display:grid;grid-template-columns:1.35fr .8fr;gap:12px;align-items:center}.paper-headline{font-size:32px;line-height:1.02;font-weight:900;margin:8px 0}.paper-sub{font-size:14px;line-height:1.45}.paper-meta{font:700 10px Inter,sans-serif;margin-top:14px}.paper-art{position:relative;display:flex;justify-content:center;align-items:center}.paper-trophy{position:absolute;right:0;bottom:5px;background:#f4efe2;border-radius:50%;padding:5px}.paper-quote{border-top:1px solid #aaa;border-bottom:1px solid #aaa;padding:10px 0;margin-top:8px;font-style:italic;font-size:13px}.paper-quote:before{content:'“';font-size:28px;vertical-align:-8px;margin-right:3px}@media(max-width:640px){.paper-grid{grid-template-columns:1fr}.paper-headline{font-size:25px}}

html,body{width:100%;max-width:100%;overflow-x:hidden}
*{box-sizing:border-box}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
img,svg,canvas{max-width:100%}
@media(max-width:740px){
  body{padding:8px 8px 24px}
  .wrap{width:100%;max-width:100%}
  .topbar{padding:12px 13px;margin-bottom:9px;min-height:56px}
  .topbar .brand-name{font-size:17px}
  .topbar .brand-sub{font-size:9px}
  .topbar .rank-num{font-size:22px}
  .topbar .rank-lbl{font-size:9px}
  .topbar .rank-delta{font-size:10px}
  .grid{grid-template-columns:1fr;gap:9px}
  .card{padding:15px;border-radius:13px;min-width:0}
  .stage-h{font-size:20px}
  .stage-p{font-size:13px;line-height:1.45;overflow-wrap:anywhere}
  .choice{width:100%;padding:12px;border-radius:11px}
  .choice .desc{font-size:11px;line-height:1.35}
  .choice .tag{font-size:9px}
  .actions{display:flex;flex-wrap:wrap;gap:8px}
  .btn{padding:11px 14px}
  .opt-grid{grid-template-columns:1fr 1fr;gap:7px}
  .opt{padding:10px;border-radius:9px}
  .opt .h{font-size:12px}.opt .d{font-size:10px;line-height:1.3}
  .creation-progress{margin-bottom:17px}
  .creation-progress span{height:4px}
  .field input[type=text]{width:100%;font-size:16px}
  .hero{padding:30px 8px 12px}
  .hero h1{font-size:40px}
  .hero p{font-size:14px;line-height:1.5}
  .badges{grid-template-columns:1fr}
}
@media(max-width:390px){
  .opt-grid{grid-template-columns:1fr}
  .topbar .rank-delta{display:none}
  .stage-h{font-size:19px}
}
@media(min-width:741px){
  body{padding:24px 18px 60px}
  .wrap{max-width:1040px}
  .grid{grid-template-columns:280px minmax(0,1fr);align-items:start}
  .card{min-width:0}
}

.decision-gain{margin:0 0 14px;padding:12px 14px;border:1px solid #dfe7df;border-radius:12px;background:#f7faf7}
.decision-gain b{font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.gain-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gain{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}
.gain.up{background:#e5f4e8;color:#17652b}.gain.down{background:#fae7e7;color:#8d2525}.gain.neutral{background:#edf0ed;color:#536057}


.choice.sel{border-color:var(--ball-dark); background:#F4FADF;}
.tourn-banner{padding:14px 16px;border-radius:12px;color:#fff; position:relative; overflow:hidden;}
.tourn-banner::after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,0.12);}
.tourn-banner-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;}
.tourn-banner-sub{font-size:12px;opacity:.85;margin-top:2px;}

.opt.locked{opacity:.55; cursor:not-allowed; background:#F2F4EF;}
.opt.locked .h{color:var(--muted);}

.mod-banner{display:flex; align-items:center; gap:12px; background:#F9FBF7; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:2px 0 14px;}
.mod-icon{flex-shrink:0;}
.mod-label{font-weight:700; font-size:13.5px;}
.mod-desc{font-size:12px; color:var(--muted); margin-top:2px; line-height:1.4;}

.qualif-banner{
  text-align:center; padding:30px 16px; border-radius:16px;
  background:linear-gradient(180deg, #FBF4E4, var(--surface));
  border:1px solid var(--line);
  position:relative; overflow:hidden;
}
.qualif-banner::before{
  content:"";
  position:absolute; inset:0;
  background-image:radial-gradient(rgba(217,164,65,0.25) 2px, transparent 2px);
  background-size:22px 22px;
  opacity:.5;
}
.qualif-trophy{position:relative;margin-bottom:10px;}
.qualif-title{position:relative; font-family:'Poppins',sans-serif; font-weight:800; font-size:22px; color:var(--net); margin-bottom:8px;}
.qualif-text{position:relative; font-size:14.5px; color:#37493D; max-width:440px; margin:0 auto; line-height:1.55;}

.rating{position:relative; overflow:hidden;}
.rating .rating-bg{position:absolute; top:-10px; right:-10px; opacity:.16;}
.hero-illustration{display:flex; justify-content:center; margin-bottom:26px;}

/* === CARRIERE VIVANTE : rivalites, moments, histoire === */
.career-memory{margin-top:14px}.memory-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.memory-year{font-weight:800;min-width:72px;color:var(--net)}.memory-title{font-weight:800}.memory-text{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}.rival-card{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfcf8;margin-top:10px}.rival-score{font-size:20px;font-weight:900;margin:5px 0}.career-banner{padding:16px;border-radius:14px;background:linear-gradient(135deg,#10251d,#203f32);color:white;margin-bottom:14px}.career-banner .small{opacity:.75;font-size:11px}.impact{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.impact span{padding:5px 8px;border-radius:999px;background:#f1f4ed;font-size:11px;font-weight:700}.tournament-progress{display:flex;gap:6px;margin:12px 0}.tournament-progress span{flex:1;height:6px;border-radius:10px;background:#e5e9e1}.tournament-progress span.done{background:var(--net)}
</style>
</head>
<body>
<div id="bg-court"></div>
<div class="wrap" id="app"></div>

<script>
/* ============ OUTILS ============ */
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const choose = (arr) => arr[rand(0, arr.length - 1)];
const eur = (v) => v.toLocaleString('fr-FR') + ' €';

const BALL_ICON = (size=28) => `<svg class="icon-ball" width="${size}" height="${size}" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
<circle cx="20" cy="20" r="18" fill="#CFEA3E" stroke="#132A1D" stroke-width="1.5"/>
<path d="M4 12C10 18 10 22 4 28" stroke="#132A1D" stroke-width="1.5" fill="none"/>
<path d="M36 12C30 18 30 22 36 28" stroke="#132A1D" stroke-width="1.5" fill="none"/>
</svg>`;

const TROPHY_ICON = (size=56, color='#D9A441') => `<svg width="${size}" height="${size}" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
<path d="M18 10h28v8c0 9-6 15-14 15S18 27 18 18v-8z" fill="${color}" stroke="#132A1D" stroke-width="1.5"/>
<path d="M18 13H9c0 8 4 12 10 13" fill="none" stroke="${color}" stroke-width="3"/>
<path d="M46 13h9c0 8-4 12-10 13" fill="none" stroke="${color}" stroke-width="3"/>
<rect x="28" y="33" width="8" height="10" fill="${color}" stroke="#132A1D" stroke-width="1.5"/>
<path d="M20 50c0-4 5-7 12-7s12 3 12 7v3H20v-3z" fill="${color}" stroke="#132A1D" stroke-width="1.5"/>
</svg>`;

const COURT_ILLUSTRATION = (w=520,h=280) => `<svg width="${w}" height="${h}" viewBox="0 0 520 280" xmlns="http://www.w3.org/2000/svg">
<rect x="4" y="4" width="512" height="272" rx="14" fill="#B4552A"/>
<rect x="24" y="24" width="472" height="232" fill="none" stroke="#FBEEE3" stroke-width="3"/>
<line x1="24" y1="140" x2="496" y2="140" stroke="#FBEEE3" stroke-width="3"/>
<line x1="130" y1="24" x2="130" y2="256" stroke="#FBEEE3" stroke-width="2"/>
<line x1="390" y1="24" x2="390" y2="256" stroke="#FBEEE3" stroke-width="2"/>
<line x1="130" y1="70" x2="390" y2="70" stroke="#FBEEE3" stroke-width="2"/>
<line x1="130" y1="210" x2="390" y2="210" stroke="#FBEEE3" stroke-width="2"/>
<line x1="260" y1="70" x2="260" y2="210" stroke="#FBEEE3" stroke-width="2"/>
<line x1="260" y1="20" x2="260" y2="260" stroke="#8A3E1F" stroke-width="4" stroke-dasharray="2 6"/>
<circle cx="260" cy="140" r="11" fill="#CFEA3E" stroke="#3B2415" stroke-width="1.5"/>
</svg>`;

/* Grand court en perspective, utilisé comme fond persistant en filigrane derrière tout le jeu */
/* 5 palettes de couleurs différentes pour le fond de court (terre battue, gazon, dur, nocturne, coucher de soleil) */
const COURT_PALETTES = [
  { name:'terre', sky1:'#8A3E1F', sky2:'#B4552A', court:'#B4552A', crowd:'#3B2415', lines:'#FBEEE3', dash:'#3B2415', ball:'#CFEA3E' },
  { name:'gazon', sky1:'#0F3B22', sky2:'#1B5E3A', court:'#1B5E3A', crowd:'#0A2416', lines:'#E7F3EB', dash:'#0A2416', ball:'#F2E24A' },
  { name:'dur', sky1:'#12335C', sky2:'#1B4B8C', court:'#1B4B8C', crowd:'#0B1F3B', lines:'#EAF2FB', dash:'#0B1F3B', ball:'#CFEA3E' },
  { name:'nocturne', sky1:'#1D1533', sky2:'#3B2A5C', court:'#2E2350', lines:'#E9E1F7', dash:'#150F26', ball:'#F2E24A', crowd:'#150F26' },
  { name:'coucher', sky1:'#5B1E3D', sky2:'#8C3E63', court:'#8C3E63', crowd:'#3B1226', lines:'#FBEAF1', dash:'#3B1226', ball:'#F2C24A' },
];
const COURT_BACKDROP = (pal) => `<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${pal.sky1}"/>
    <stop offset="100%" stop-color="${pal.sky2}"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="900" height="180" fill="url(#bgSky)"/>

/* ============ SURFACES & INFLUENCE NATIONALITÉ / STYLE ============ */
const SURFACES = ['dur','terre','gazon'];
const SURFACE_LABELS = { dur:'Dur', terre:'Terre battue', gazon:'Gazon' };
/* Chaque nation a une culture de surface dominante : familiarité accrue sur cette surface */
const NATION_SURFACE = { fr:'terre', es:'terre', ar:'terre', it:'terre', uk:'gazon', au:'dur', us:'dur', jp:'dur', sr:'dur', ma:'terre' };
const SLAM_SURFACE = { ao:'dur', rg:'terre', wim:'gazon', uso:'dur' };
/* Affinité de style par surface : bonus/malus de probabilité de victoire */
const STYLE_SURFACE_BONUS = {
  fond:    { terre:0.05, dur:0.0,  gazon:-0.04 },
  sv:      { terre:-0.06, dur:0.01, gazon:0.07 },
  poly:    { terre:0.01, dur:0.02, gazon:0.01 },
  cogneur: { terre:-0.02, dur:0.04, gazon:0.02 },
};
function matchSurface(cur){
  if(cur.tier==='slam') return SLAM_SURFACE[cur.slamId] || 'dur';
  return cur.surface || 'dur';
}
/* Bonus lié à la nationalité : familiarité de surface + soutien du public à domicile */
function nationSurfaceMod(p, surface){
  return NATION_SURFACE[p.nation.id]===surface ? 0.02 : 0;
}
function homeCrowdMod(p, cur){
  if(cur.tier==='slam' && NATION_SLAM_ID[p.nation.id]===cur.slamId) return 0.05;
  return 0;
}
function styleSurfaceMod(p, surface){
  const t = STYLE_SURFACE_BONUS[p.style.id];
  return t ? (t[surface]||0) : 0;
}
/* Seeding : un joueur mieux classé évite les gros chocs tôt dans le tableau, et inversement */
function seedingMod(p, cur){
  const progress = cur.totalRounds<=1 ? 1 : cur.roundIndex / (cur.totalRounds-1);
  let rankFactor = 0;
  if(p.rank<=8) rankFactor = 0.05;
  else if(p.rank<=32) rankFactor = 0.03;
  else if(p.rank<=100) rankFactor = 0.01;
  else if(p.rank>500) rankFactor = -0.02;
  // avantage en début de tableau, désavantage (retour à l'équilibre) en fin de tableau contre les meilleurs
  return rankFactor * (1 - progress) - rankFactor*0.4*progress;
}

function gameplanChoices(p,ev){
  const seed=(p.season*11+p.age+ev.title.length)%GAMEPLAN_EXTRA_CHOICES.length;
  return ev.choices.concat([GAMEPLAN_EXTRA_CHOICES[seed],GAMEPLAN_EXTRA_CHOICES[(seed+2)%GAMEPLAN_EXTRA_CHOICES.length]]);
}

function isToughOpponent(p, cur){
  const tier = TIERS[cur.tier];
  const oppSkill = tier.baseOpp + cur.roundIndex*tier.oppInc;
  return (oppSkill - skillOf(p)) > 6;
}

function pickScript(p, key, scripts){
  const usedKey = key+'Used';
  if(!p[usedKey]) p[usedKey] = [];
  let pool = scripts.filter((_,i)=>!p[usedKey].includes(i));
  if(!pool.length){ p[usedKey] = []; pool = scripts; }
  const chosen = choose(pool);
  const idx = scripts.indexOf(chosen);
  p[usedKey].push(idx);
  return chosen;
}

const RANK_BANDS = [
  [9200, 1], [7500, 5], [6000, 12], [4600, 22], [3400, 40],
  [2400, 65], [1600, 100], [1000, 160], [600, 260], [320, 420],
  [150, 650], [50, 900], [0, 1400]
];


function tournamentImpact(p, outcome, round, opponent='Adversaire'){
  ensureCareerData(p);
  p.tournamentHistory.push({season:p.season,round,outcome,opponent});
  if(p.tournamentHistory.length>100)p.tournamentHistory.shift();
  if(outcome==='W'){ p.morale=clamp(p.morale+2,0,100); addMemory(p,`Victoire — ${round}`,`Tu bats ${opponent}. Cette victoire renforce ta confiance avant le tour suivant.`); }
  else { p.morale=clamp(p.morale-2,0,100); addMemory(p,`Défaite — ${round}`,`Tu t'arrêtes contre ${opponent}. La suite de la saison devra servir de réponse.`); }
}

function ensureCareerData(p){
  p.memories ||= []; p.rivals ||= {}; p.tournamentHistory ||= []; p.firstTitles ||= {};
}
function addMemory(p,title,text,icon='✦'){ ensureCareerData(p); p.memories.push({season:p.season,age:p.age,title,text,icon}); if(p.memories.length>80)p.memories.shift(); }
function addRival(p,name,result){ ensureCareerData(p); if(!p.rivals[name])p.rivals[name]={wins:0,losses:0}; result==='W'?p.rivals[name].wins++:p.rivals[name].losses++; }
function topRival(p){ ensureCareerData(p); return Object.entries(p.rivals).sort((a,b)=>(b[1].wins+b[1].losses)-(a[1].wins+a[1].losses))[0]; }

function snapshotStats(p){
  return {technique:p.stats.technique,service:p.stats.service,physique:p.stats.physique,mental:p.stats.mental,morale:p.morale,energy:p.energy,rep:p.rep,money:p.money};
}

function pointsToRank(points){
  for(let i=0;i<RANK_BANDS.length;i++){
    const [threshold, rankAtThreshold] = RANK_BANDS[i];
    if(points >= threshold){
      if(i===0) return rankAtThreshold;
      const [prevThreshold, prevRank] = RANK_BANDS[i-1];
      const span = prevThreshold - threshold;
      const frac = span<=0 ? 0 : (points - threshold) / span;
      return Math.max(1, Math.round(rankAtThreshold - frac*(rankAtThreshold - prevRank)));
    }
  }
  return 1400;
}

function pickPressComment(p, category){
  const key = 'usedPress_'+category;
  if(!p[key]) p[key] = [];
  const list = PRESS_COMMENTS[category] || PRESS_COMMENTS.early_exit;
  let pool = list.filter((_,i)=>!p[key].includes(i));
  if(!pool.length){ p[key] = []; pool = list; }
  const chosen = choose(pool);
  p[key].push(list.indexOf(chosen));
  const tone = category==='title'||category==='rank_up' ? 'positive' : category==='semi_loss'||category==='rank_down' ? 'neutral' : 'negative';
  return { comment: chosen, responses: PRESS_RESPONSES[tone] };
}
function pressCategoryFor(r){
  if(r.injured) return 'injury';
  if(r.champion) return 'title';
  const rl = roundLabel(r.roundsWon, r.totalRounds);
  if(rl==='finale') return 'final_loss';
  if(rl==='demi-finale') return 'semi_loss';
  return 'early_exit';
}

/* ============ CALENDRIER DE BASE (petits tournois) ============ */
function planSeason(rank, intensityId, age){
  const opt = CALENDAR_OPTIONS.find(c=>c.id===intensityId) || CALENDAR_OPTIONS.find(c=>c.id==='standard');
  const mult = opt.mult;
  const fill = (tier,n) => Array(Math.max(0, Math.round(n*mult))).fill(tier);
  let plan = [];
  if(age>=21){
    if(rank>800) plan=[...fill('challenger',2),...fill('atp250',2)];
    else if(rank>500) plan=[...fill('challenger',1),...fill('atp250',3),...fill('atp500',2)];
    else if(rank>250) plan=[...fill('atp250',2),...fill('atp500',2)];
    else if(rank>100) plan=[...fill('atp500',3)];
    else plan=[...fill('atp500',2)];
  }else if(age>=19){
    if(rank>900) plan=[...fill('challenger',2),...fill('atp250',3)];
    else if(rank>500) plan=[...fill('challenger',1),...fill('atp250',3),...fill('atp500',2)];
    else plan=[...fill('atp250',3),...fill('atp500',2)];
  }else if(age>=17){
    plan=[...fill('challenger',4),...fill('atp250',2)];
  }else{
    plan=[...fill('challenger',4),...fill('atp250',1)];
  }
  return plan;
}

function skillOf(p){
  const s = p.stats;
  const base = s.technique*0.28 + s.service*0.24 + s.physique*0.22 + s.mental*0.26 + 6;
  const form = (0.78 + 0.4*(p.energy/100)) * (0.85 + 0.3*(p.morale/100));
  return base * form;
}

function roundLabel(roundsWon, totalRounds){
  const labels = ['1er tour','2e tour','3e tour','8es de finale','quarts de finale','demi-finale','finale','Titre 🏆'];
  const fromEnd = totalRounds - roundsWon;
  if(roundsWon === totalRounds) return 'Titre 🏆';
  const idx = Math.max(0, labels.length - 1 - fromEnd);
  return labels[Math.min(idx, labels.length-2)];
}

function ageAdjust(p){
  /* Équilibrage : progression légèrement plus généreuse en début de carrière,
     pour que les jeunes joueurs sentent une vraie évolution saison après saison. */
  if(p.age<=23){
    p.stats.technique = clamp(p.stats.technique + rand(1,3), 5, 99);
    p.stats.service = clamp(p.stats.service + rand(1,3), 5, 99);
    p.stats.physique = clamp(p.stats.physique + rand(1,3), 5, 99);
    p.stats.mental = clamp(p.stats.mental + rand(1,3), 5, 99);
  } else if(p.age<=29){
    p.stats.mental = clamp(p.stats.mental + rand(0,1), 5, 99);
  } else if(p.age<=32){
    p.stats.physique = clamp(p.stats.physique - rand(0,2), 5, 99);
  } else {
    p.stats.physique = clamp(p.stats.physique - rand(1,3), 5, 99);
    p.stats.service = clamp(p.stats.service - rand(0,1), 5, 99);
  }
}

  const improvement = p.rank>500 ? 150 : p.rank>200 ? 80 : p.rank>80 ? 30 : 10;

  const rewardMoney = 4000 + Math.round((600 - Math.min(p.rank,600)) * 8);
  return {
    label: `Progresser jusqu'au rang #${targetRank}, ou remporter un titre cette saison`,
    targetRank, rewardMoney, rewardRep: 6,
  };
}

/* ============ MOTEUR DE SAISON, PAS À PAS ============ */
function startSeason(p, choice){
  ageAdjust(p);
  applyTrainingFocus(p, choice.focus);
  const modBonus = choice.modifier ? choice.modifier.bonus : 0;
  const seasonGoal = choice.goal || generateSeasonGoal(p);
  if(p.skipSeason){
    p.skipSeason = false;
    p.lastRecap = { intensity:'Saison blanche', played:0, stopped:true, results:[], titlesThisSeason:[], seasonPoints:0, seasonPrize:0, rankBefore:p.rank, rankAfter:p.rank };
    log(p, 'Saison blanche après une opération.');
    p.energy = clamp(p.energy+50,0,100);
    p.seasonsPlayed++;
    p.phase = 'recap';
    render();
    return;
  }
  const basePlan = planSeason(p.rank, choice.intensity, p.age);
  const queue = basePlan.map(t=>({tier:t, slamId:null}));
  Object.keys(choice.slams).forEach(sid=>{ if(choice.slams[sid]) queue.push({tier:'slam', slamId:sid}); });
  for(let i=0;i<choice.masters;i++){ queue.push({tier:'masters', slamId:null}); }
  p.seasonRun = {
    queue, idx:0, results:[], seasonPoints:0, seasonPrize:0, titlesThisSeason:[], stopped:false,
    current:null, intensityLabel: CALENDAR_OPTIONS.find(c=>c.id===choice.intensity).label, modBonus,
    energyMod: (CALENDAR_OPTIONS.find(c=>c.id===choice.intensity)||{}).energyMod || 0,
    injuryMod: (CALENDAR_OPTIONS.find(c=>c.id===choice.intensity)||{}).injuryMod || 0,
    goal: seasonGoal,
  };
  advanceSeason(p);
}

function advanceSeason(p){
  const run = p.seasonRun;
  if(!run.current){
    if(p.energy < 12 || run.idx >= run.queue.length){ finalizeSeason(p); return; }
    const item = run.queue[run.idx]; run.idx++;
    const totalRounds = TIERS[item.tier].points.length - 1;
    const surface = item.tier==='slam' ? SLAM_SURFACE[item.slamId] : choose(SURFACES);
    run.current = { tier:item.tier, slamId:item.slamId, roundIndex:0, totalRounds, roundsWon:0, injuryBonus:0, surface };
  }
  simulateRounds(p);
}

function playRound(p, cur, tacticMod){
  const tier = TIERS[cur.tier];
  const baseSkill = skillOf(p);
  const oppSkill = tier.baseOpp + cur.roundIndex*tier.oppInc + rand(-6,6);
  const eff = baseSkill + rand(-5,5) + 12;
  const surface = matchSurface(cur);
  const surfaceMod = styleSurfaceMod(p, surface) + nationSurfaceMod(p, surface);
  const contextMod = surfaceMod + homeCrowdMod(p, cur) + seedingMod(p, cur) + (p.seasonRun ? p.seasonRun.modBonus||0 : 0);
  const winProb = clamp(eff/(eff+oppSkill) + tacticMod + contextMod, 0.02, 0.98);
  const won = Math.random() < winProb;
  const roundCost = 2 + Math.floor(tier.energyCost / cur.totalRounds) - (p.seasonRun ? Math.round((p.seasonRun.energyMod||0)/3) : 0);
  p.energy = clamp(p.energy - roundCost, 0, 100);
  return won;
}

function simulateRounds(p){
  const run = p.seasonRun; const cur = run.current;
  while(cur.roundIndex < cur.totalRounds){
    const isSemi = cur.roundIndex === cur.totalRounds - 2;
    const isFinal = cur.roundIndex === cur.totalRounds - 1;
    /* Chaque tour important se joue maintenant : le joueur influence réellement son parcours. */
    if(cur.roundIndex >= 0){
      if((isSemi || isFinal) && !cur.gameplanDone && isToughOpponent(p, cur) && Math.random()<0.55){
        if(!p.usedGameplanEvents) p.usedGameplanEvents = [];
        let pool = GAME_PLAN_EVENTS.filter((_,i)=>!p.usedGameplanEvents.includes(i));
        if(!pool.length){ p.usedGameplanEvents = []; pool = GAME_PLAN_EVENTS; }
        const ev = choose(pool);
        p.usedGameplanEvents.push(GAME_PLAN_EVENTS.indexOf(ev));
        pendingGameplan = ev;
        p.phase = 'gameplan';
        render();
        return;
      }
      cur.gameplanDone = true;
      if(cur.vsRivalRound !== cur.roundIndex){
        cur.vsRivalRound = cur.roundIndex;
        cur.vsRival = !!(p.rival && (cur.tier==='masters'||cur.tier==='slam') && Math.random()<0.3);
      }
      p.phase = 'match_choice';
      render();
      return;
    }
    const won = playRound(p, cur, 0);
    if(!won){ finishTournament(p, false); return; }
    cur.roundIndex++;
    cur.roundsWon++;
  }
  finishTournament(p, true);
}

function resolveTactic(p, tacticId){
  const run = p.seasonRun; const cur = run.current;
  const t = (cur.tacticOptions || MATCH_TACTICS).find(x=>x.id===tacticId) || MATCH_TACTICS.find(x=>x.id===tacticId);
  cur.tacticOptions = null;
  const gpBonus = cur.gameplanBonus || 0;
  cur.gameplanBonus = 0;
  const won = playRound(p, cur, t.probMod + gpBonus);
  p.energy = clamp(p.energy - t.energyCostMod, 0, 100);
  cur.injuryBonus += t.injuryMod;
  if(cur.vsRival){ if(won) p.rival.wins++; else p.rival.losses++; log(p, won ? `Vous battez ${p.rival.name} (${p.rival.wins}-${p.rival.losses} au total).` : `${p.rival.name} vous bat cette fois (${p.rival.wins}-${p.rival.losses} au total).`); cur.vsRival = false; }
  if(!won){ finishTournament(p, false); return; }
  cur.roundIndex++;
  cur.roundsWon++;
  if(cur.roundIndex >= cur.totalRounds){ finishTournament(p, true); return; }
  simulateRounds(p);
}

function finishTournament(p, champion){
  const run = p.seasonRun; const cur = run.current; const tier = TIERS[cur.tier];
  const points = tier.points[cur.roundsWon];
  const prize = tier.prize[cur.roundsWon];
  run.seasonPoints += points;
  run.seasonPrize += prize;
  if(champion){
    const firstOfCategory = p.titles[cur.tier]===0;
    p.titles[cur.tier]++; run.titlesThisSeason.push(tournamentLabel(cur.tier, cur.slamId));
    if(firstOfCategory){ p.firstTitlesSeen[cur.tier]=true; p.pendingNewspaper=cur.tier; }
    if(cur.tier==='slam' && NATION_SLAM_ID[p.nation.id]===cur.slamId){ p.wonHomeSlam = true; }
  }
  const res = { tier:cur.tier, slamId:cur.slamId, roundsWon:cur.roundsWon, totalRounds:cur.totalRounds, points, prize, champion, surface:cur.surface };
  run.results.push(res);
  const injuryChance = 1.5 + (100-p.stats.physique)*0.10 + (100-p.energy)*0.08 + cur.injuryBonus + (run.injuryMod||0);
  let injured = false;
  if(rand(1,100) <= injuryChance){ injure(p, choose(['cheville','genou','épaule','dos','poignet'])); injured = true; run.stopped = true; }
  run.current = null;
  p.lastTournamentResult = { ...res, injured };
  p.phase = 'tournament_result';
  render();
}

function finalizeSeason(p){
  const run = p.seasonRun;
  p.money += run.seasonPrize;
  p.points = Math.round(p.points*0.96 + run.seasonPoints);
  p.prevRank = p.rank;
  const oldRank = p.rank; p.rank = pointsToRank(p.points);
  if(oldRank>100 && p.rank<=100)addMemory(p,'Entrée dans le Top 100','Tu entres enfin parmi les 100 meilleurs du circuit.');
  if(oldRank>50 && p.rank<=50)addMemory(p,'Entrée dans le Top 50','Le Top 50 devient une réalité.');
  if(oldRank>10 && p.rank<=10)addMemory(p,'Entrée dans le Top 10','Tu entres dans le cercle très fermé des dix meilleurs.');
  if(oldRank!==1 && p.rank===1)addMemory(p,'Numéro 1 mondial','Tu atteins la première place mondiale.');
  if(p.rank < p.bestRank) p.bestRank = p.rank;
  if(!p.slamEligible && p.rank <= SLAM_ELIGIBLE_RANK){ p.slamEligible = true; p.pendingSlamQualified = true; }
  p.seasonsPlayed++;
  p.energy = clamp(p.energy + 55, 0, 100);
  p.morale = clamp(p.morale + (p.morale<55 ? 8 : 2), 0, 100);
  let goalResult = null;
  if(run.goal){
    const achieved = p.rank <= run.goal.targetRank || run.titlesThisSeason.length > 0;
    if(achieved){ p.money += run.goal.rewardMoney; p.rep = clamp(p.rep + run.goal.rewardRep, 0, 100); }
    goalResult = { label: run.goal.label, achieved, rewardMoney: run.goal.rewardMoney, rewardRep: run.goal.rewardRep };
    log(p, achieved ? `Objectif de saison rempli : ${run.goal.label}.` : `Objectif de saison manqué : ${run.goal.label}.`);
  }
  p.lastRecap = {
    intensity: run.intensityLabel, played: run.results.length, stopped: run.stopped, results: run.results,
    titlesThisSeason: run.titlesThisSeason, seasonPoints: run.seasonPoints, seasonPrize: run.seasonPrize,
    rankBefore: p.prevRank, rankAfter: p.rank, goalResult,
  };
  if(run.titlesThisSeason.length){ log(p, `${run.titlesThisSeason.length} titre(s) : ${run.titlesThisSeason.join(', ')}.`); }
  log(p, `Fin de saison, classement #${p.rank}.`);
  p.seasonRun = null;
  p.phase = 'recap';
  render();
}

/* ============ BILAN ============ */
function legendScore(p){
  let score = p.titles.slam*100 + p.titles.masters*35 + p.titles.atp500*12 + p.titles.atp250*6 + p.titles.challenger*1.5;
  if(p.bestRank===1) score += 90;
  else if(p.bestRank<=5) score += 50;
  else if(p.bestRank<=10) score += 30;
  else if(p.bestRank<=50) score += 12;
  else if(p.bestRank<=100) score += 5;
  score += Math.floor(p.money/500000);
  score += p.seasonsPlayed*1.2;
  score -= p.injuries.length*4;
  return Math.max(0, Math.round(score));
}
const RATING_FLAVORS = {
  S: ['Une carrière hors normes.', 'Un nom que le circuit n\'oubliera pas.', 'L\'histoire du tennis retiendra ce nom.'],
  A: ['Un grand nom du circuit.', 'Une carrière de tout premier plan.', 'Le genre de parcours qu\'on raconte encore.'],
  B: ['Une très belle carrière.', 'Un parcours solide et respecté.', 'De quoi être fier, saison après saison.'],
  C: ['Une carrière solide sur le circuit.', 'Un professionnel du circuit, sans éclat majeur.', 'Un parcours honnête, fait de hauts et de bas.'],
  D: ['Modeste, mais un rêve vécu.', 'Peu de trophées, mais une vraie aventure.', 'Le circuit vous aura appris beaucoup.'],
  E: ['Le circuit ne vous aura pas gardé.', 'Une carrière écourtée, sans grand résultat.', 'Le rêve était là, les résultats moins.'],
};
function legendRating(score){
  let letter;
  if(score>=180) letter='S';
  else if(score>=110) letter='A';
  else if(score>=60) letter='B';
  else if(score>=25) letter='C';
  else if(score>=8) letter='D';
  else letter='E';
  return { letter, flavor: choose(RATING_FLAVORS[letter]) };
}
function careerNarrative(p){
  const totalTitles = Object.values(p.titles).reduce((a,b)=>a+b,0);
  const parts = [];
  parts.push(`${p.name}, ${p.nation.label}, aura passé ${p.seasonsPlayed} saison${p.seasonsPlayed>1?'s':''} sur le circuit avec un style ${p.style.label.toLowerCase()}.`);
  if(p.titles.slam>=1){ parts.push(p.wonHomeSlam ? 'Le sommet a été atteint jusque devant son propre public, sur son tournoi national.' : 'Le Grand Chelem aura été conquis, au moins une fois.'); }
  else if(p.bestRank<=50){ parts.push(`Le top ${p.bestRank<=10?'10':'50'} mondial aura été approché de très près, sans jamais soulever de trophée majeur.`); }
  else if(totalTitles>0){ parts.push('Les titres sont restés modestes, mais bien réels.'); }
  else { parts.push('Les titres n\'auront jamais suivi, malgré les efforts.'); }
  if(p.injuries.length>=3){ parts.push('Le corps aura payé cher cette carrière, entre blessures et rééducations.'); }
  else if(p.injuries.length===0){ parts.push('Un corps qui aura tenu bon, saison après saison.'); }
  return parts.join(' ');
}
/* ============ COMPARAISON DE CARRIÈRE ============ */
const LEGENDARY_PLAYERS = [
  { name:'Le Métronome', score:205, blurb:'8 titres du Grand Chelem, une régularité inégalée sur quinze saisons.' },
  { name:'La Foudre', score:150, blurb:'Un jeu spectaculaire, 4 titres majeurs et un Numéro 1 mondial marquant.' },
  { name:'Le Bâtisseur', score:95, blurb:'Une carrière construite pas à pas, couronnée d\'un Masters 1000 et d\'un top 10.' },
  { name:'Le Combattant', score:55, blurb:'Jamais un titre majeur, mais quinze saisons pleines et un respect unanime.' },
  { name:'L\'Espoir Discret', score:20, blurb:'Une poignée de titres modestes, une carrière honnête loin des sommets.' },
];
function careerComparison(p){
  const score = legendScore(p);
  const sorted = LEGENDARY_PLAYERS.slice().sort((a,b)=>b.score-a.score);
  let above = sorted.filter(l=>score>=l.score);
  let closest;
  if(above.length){ closest = above[0]; }
  else { closest = sorted[sorted.length-1]; }
  return { score, closest, rankAmong: sorted.filter(l=>l.score>score).length + 1, total: sorted.length+1 };
}

function computeBadges(p){
  const b = [];
  if(p.titles.slam>=1) b.push({h:'Champion du Grand Chelem', d:'Vous avez soulevé un trophée majeur.'});
  if(p.titles.slam>=3) b.push({h:'Multiple champion majeur', d:'Trois titres majeurs ou plus.'});
  if(p.bestRank===1) b.push({h:'Numéro 1 mondial', d:'Vous avez atteint le sommet.'});
  if(p.injuries.length===0 && p.seasonsPlayed>=10) b.push({h:'Increvable', d:'Dix saisons sans aucune blessure.'});
  if(p.seasonsPlayed>=18) b.push({h:'Grande longévité', d:'Une carrière très longue.'});
  if(p.background.id==='muni' && legendScore(p)>=60) b.push({h:'Parti de rien', d:'Des cours municipaux jusqu\'au sommet.'});
  const totalTitles = Object.values(p.titles).reduce((a,b)=>a+b,0);
  if(totalTitles===0 && p.seasonsPlayed>=10) b.push({h:'Pour l\'expérience', d:'Une longue carrière sans trophée.'});
  if(p.injuries.length>=4) b.push({h:'Corps de guerrier', d:'Quatre blessures ou plus, sans jamais abandonner.'});
  if(p.money>=5000000) b.push({h:'Fortune du circuit', d:'Plus de 5 millions d\'euros de gains.'});
  if(p.wonHomeSlam) b.push({h:'Enfant du pays', d:'Un titre du Grand Chelem remporté devant votre public.'});
  if(p.slamEligible && p.titles.slam===0) b.push({h:'Qualifié, jamais couronné', d:'Le Grand Chelem vous a ouvert ses portes, sans jamais céder son trophée.'});
  if(!p.slamEligible) b.push({h:'Resté loin des grandes scènes', d:'Le Grand Chelem ne vous aura jamais été accessible.'});
  if(p.rival && p.rival.wins > p.rival.losses && (p.rival.wins+p.rival.losses)>=3) b.push({h:'Bourreau de son rival', d:`Un bilan favorable face à ${p.rival.name} (${p.rival.wins}V-${p.rival.losses}D).`});
  if((p.davisSelections||0)>=3) b.push({h:'Ambassadeur', d:'Sélectionné au moins trois fois en équipe nationale.'});
  if(!b.length) b.push({h:'Une carrière sur le circuit', d:'Chaque saison a été une bataille.'});
  return b;
}

function pickEvent(p){
  const ALL_FUNNY_EVENTS = FUNNY_EVENTS.concat(FUNNY_VARIANTS);
  const eligibleFunny = ALL_FUNNY_EVENTS.filter(e => p.age>=e.min && p.age<=e.max);
  const eligibleSerious = EVENTS.filter(e => p.age>=e.min && p.age<=e.max);
  let funny = eligibleFunny.filter(e => !usedFunnyEvents.includes(e.id));
  let serious = eligibleSerious.filter(e => !usedSeriousEvents.includes(e.id));

  let pool, isFunny;
  if(Math.random() < 0.52 && funny.length){ pool = funny; isFunny = true; }
  else if(serious.length){ pool = serious; isFunny = false; }
  else if(funny.length){ pool = funny; isFunny = true; }
  else {
    if(eligibleFunny.length){ usedFunnyEvents = []; funny = eligibleFunny; }
    if(eligibleSerious.length){ usedSeriousEvents = []; serious = eligibleSerious; }
    if(Math.random() < 0.52 && funny.length){ pool = funny; isFunny = true; }
    else { pool = serious.length ? serious : funny; isFunny = !serious.length; }
  }
  const ev = choose(pool);
  if(isFunny) usedFunnyEvents.push(ev.id); else usedSeriousEvents.push(ev.id);
  usedEvents.push(ev.id);
  return ev;
}

    memories.innerHTML = list.length ? list.map(m=>`<div class="memory-item"><div class="memory-year">S${m.season} · ${m.age} ans</div><div><div class="memory-title">${m.icon} ${m.title}</div><div class="memory-text">${m.text}</div></div></div>`).join('') : '<div class="memory-text">Les grands moments de ta carrière apparaîtront ici.</div>';

}

  {label:'Protéger votre énergie',tag:'Gestion',desc:'Vous pensez déjà au prochain match et économisez vos forces.',effect:p=>{p.energy=clamp(p.energy+4,0,100);p.morale=clamp(p.morale+1,0,100);log(p,'Vous avez privilégié la gestion de votre énergie.');}},

  {label:'Rester totalement professionnel',tag:'Professionnalisme',desc:'Vous ne laissez rien perturber votre routine.',effect:p=>{p.stats.mental=clamp(p.stats.mental+1,5,99);p.energy=clamp(p.energy+1,0,100);log(p,'Vous avez gardé une attitude parfaitement professionnelle.');}},
  {label:'En parler avec un proche',tag:'Équilibre',desc:'Un regard extérieur vous aide à prendre du recul.',effect:p=>{p.morale=clamp(p.morale+5,0,100);p.rep=clamp(p.rep+1,0,100);log(p,'Vous avez pris conseil auprès d’un proche.');}},

];
function eventChoices(p, ev){
  const base=ev.choices.slice();
  const seed=(p.season*17 + ev.id.length*13 + p.age*7) % EXTRA_EVENT_CHOICES.length;
  const extras=[EXTRA_EVENT_CHOICES[seed],EXTRA_EVENT_CHOICES[(seed+3)%EXTRA_EVENT_CHOICES.length]];
  return base.concat(extras);
}

function renderStage(){
  const p = player;
  const stage = document.getElementById('stage');

  if(p.phase === 'event'){
    stage.style.background = '';
    const ev = pendingEvent || (pendingEvent = pickEvent(p));
    ensureCareerData(p);
    const rival = topRival(p);
    stage.innerHTML = `
      <div class="eyebrow">Saison ${p.season}</div>
      <div class="stage-h">${ev.title}</div>
      <div class="stage-p">${ev.text}</div>
      <div class="choices" id="choicesWrap"></div>
    `;
    const wrap = document.getElementById('choicesWrap');
    eventChoices(p, ev).forEach(c=>{
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.innerHTML = `<span class="tag">${c.tag}</span>${c.label}<span class="desc">${c.desc}</span>`;
      btn.onclick = ()=>{
        const before = snapshotStats(p);
        c.effect(p);
        const after = snapshotStats(p);
        p.lastDecisionGain = { title: ev.title, choiceLabel: c.label, before, after };
        pendingEvent = null;
        p.phase = 'decision_result';
        render();
      };
      wrap.appendChild(btn);
    });

  } else if(p.phase === 'decision_result'){
    stage.style.background = '';
    const g = p.lastDecisionGain;
    const labels = { technique:'Technique', service:'Service', physique:'Physique', mental:'Mental', morale:'Moral', energy:'Forme', rep:'Réputation', money:'Argent' };
    const rows = Object.keys(labels).map(k=>{
      const d = g.after[k] - g.before[k];
      if(Math.abs(d) < 0.01) return '';
      const cls = d>0 ? 'good' : 'bad';
      const val = k==='money'
        ? (d>0?'+':'') + eur(Math.round(d))
        : (d>0?'+':'') + (Number.isInteger(d) ? d : d.toFixed(1));
      return `<div class="recap-row"><span class="l">${labels[k]}</span><span class="r ${cls}">${val}</span></div>`;
    }).join('');
    stage.innerHTML = `
      <div class="eyebrow">Conséquences</div>
      <div class="stage-h">${g.choiceLabel}</div>
      <div class="stage-p">${g.title}</div>
      ${rows || '<div class="stage-p">Aucun changement mesurable.</div>'}
      <div class="actions"><button class="btn" id="contDecisionBtn">Continuer</button></div>
    `;
    document.getElementById('contDecisionBtn').onclick = ()=>{ calendarChoice = null; p.phase = 'calendar'; render(); };

  } else if(p.phase === 'calendar'){
    stage.style.background = '';
    if(p.skipSeason){
      startSeason(p, {intensity:'standard', slams:{}, masters:0});
      return;
    }
    renderCalendarPhase();

  } else if(p.phase === 'gameplan'){
    const run = p.seasonRun; const cur = run.current;
    const colors = tournamentColors(cur.tier, cur.slamId);
    stage.style.background = colors.light;
    stage.className = 'card surface-' + ({dur:'hard', terre:'clay', gazon:'grass'}[matchSurface(cur)] || 'hard');
    const ev = pendingGameplan;
    stage.innerHTML = `
      <div class="tourn-banner" style="background:${colors.primary};">
        <div class="tourn-banner-name" style="display:flex;align-items:center;gap:8px;">${RACKET_ICON(18,'#fff')}${tournamentLabel(cur.tier, cur.slamId)}</div>

      </div>
      <div class="eyebrow" style="margin-top:14px;">Plan de jeu</div>
      <div class="stage-h">${ev.title}</div>
      <div class="stage-p">${ev.text}</div>
      <div class="choices" id="gpWrap"></div>
    `;
    const wrap = document.getElementById('gpWrap');
    gameplanChoices(p,ev).forEach(c=>{
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.style.borderLeft = `3px solid ${colors.primary}`;
      btn.innerHTML = `<span class="tag" style="color:${colors.primary}">${c.tag}</span>${c.label}<span class="desc">${c.desc}</span>`;
      btn.onclick = ()=>{
        c.effect(p, cur);
        cur.gameplanDone = true;
        pendingGameplan = null;
        p.phase = 'match_choice';
        render();

      wrap.appendChild(btn);
    });

  } else if(p.phase === 'match_choice'){
    const run = p.seasonRun; const cur = run.current;
    const colors = tournamentColors(cur.tier, cur.slamId);
    stage.style.background = colors.light;
    stage.className = 'card surface-' + ({dur:'hard', terre:'clay', gazon:'grass'}[matchSurface(cur)] || 'hard');
    const isFinal = cur.roundIndex === cur.totalRounds-1;
    const isSemi = cur.roundIndex === cur.totalRounds-2;
    const stageLabel = isFinal ? 'Finale' : isSemi ? 'Demi-finale' : (cur.roundIndex===0 ? '1er tour' : `${cur.roundIndex+1}e tour`);
    if(!cur.script) cur.script = isFinal ? pickScript(p,'final',FINAL_SCRIPTS) : isSemi ? pickScript(p,'semi',SEMI_SCRIPTS) : pickScript(p,'round',MATCH_ROUND_SCRIPTS);
    const script = cur.script;

      <div class="choices" id="tacticWrap"></div>
    `;

      btn.onclick = ()=>{ cur.script = null; resolveTactic(p, t.id); };
      wrap.appendChild(btn);
    });

  } else if(p.phase === 'newspaper'){
    stage.style.background='';
    renderNewspaper(p);

  } else if(p.phase === 'tournament_result'){
    const r = p.lastTournamentResult;
    const colors = tournamentColors(r.tier, r.slamId);

    stage.className = 'card surface-' + ({dur:'hard', terre:'clay', gazon:'grass'}[matchSurface(r)] || 'hard');

      <div class="tourn-banner" style="background:${colors.primary};">

        <div class="tourn-banner-sub">${tournamentSurface(r.tier, r.slamId, r.surface)}</div>

    stage.style.background = '';

        <div class="qualif-text">Classé #${p.rank}, ${p.name} peut désormais s'inscrire aux quatre levées du Grand Chelem : Open d'Australie, Roland-Garros, Wimbledon et US Open.</div>

    `;
    document.getElementById('contQualifBtn').onclick = ()=>{ p.phase = 'event'; render(); };
  }
}

function autoCalendar(p){
  // choix cohérent selon le classement, l'âge et le moral du joueur, pour éviter de tout composer à la main
  let intensity;
  if(p.age>=32 || p.morale<35) intensity='leger';
  else if(p.rank>600) intensity='soutenu';
  else if(p.rank>250) intensity='standard';
  else if(p.energy<40) intensity='leger';
  else intensity = choose(['standard','soutenu']);
  const slams = {};
  if(p.slamEligible){ SLAMS.forEach(s=>{ slams[s.id] = p.rank<=120 ? true : Math.random()<0.6; }); }
  const masters = p.slamEligible ? (p.rank<=80 ? 4 : rand(1,3)) : rand(0,2);
  return { intensity, slams, masters };
}

function renderCalendarPhase(){
  const p = player;
  if(!calendarChoice) calendarChoice = { intensity:'standard', slams:{}, masters:0, expanded:false };
  const stage = document.getElementById('stage');
  if(!calendarChoice.introText) calendarChoice.introText = seasonBuildIntro(p);
  if(!calendarChoice.modifier){
    calendarChoice.modifier = pickSeasonModifier(p);
    calendarChoice.modifier.apply(p);
  }
  if(!calendarChoice.goal) calendarChoice.goal = generateSeasonGoal(p);
  if(!calendarChoice.focus) calendarChoice.focus = weakestStat(p);
  const mod = calendarChoice.modifier;
  const modToneColor = mod.tone==='good' ? '#4E8C3F' : mod.tone==='bad' ? '#D14B3E' : 'var(--net)';

  const manualHtml = calendarChoice.expanded ? `
    <div class="eyebrow" style="margin-top:16px;">Calendrier de base</div>
    <div class="choices" id="calWrap"></div>
    <div class="eyebrow" style="margin-top:18px;">Grands tournois</div>
    <div class="opt-grid" id="bigWrap"></div>
    <div class="actions"><button class="btn" id="launchSeasonBtn">Lancer la saison personnalisée</button></div>
  ` : '';

  stage.innerHTML = `
    <div class="eyebrow">Saison ${p.season}</div>
    <div class="stage-h" style="display:flex;align-items:center;gap:10px;">${RACKET_ICON(24)} Nouvelle saison</div>
    <div class="mod-banner" style="border-left:4px solid ${modToneColor}">
      <div class="mod-icon">${mod.icon(30)}</div>
      <div><div class="mod-label" style="color:${modToneColor}">${mod.label}</div><div class="mod-desc">${mod.desc}</div></div>
    </div>
    <div class="mod-banner" style="border-left:4px solid var(--gold);">
      <div class="mod-icon">${MEDAL_ICON(30)}</div>
      <div><div class="mod-label" style="color:var(--gold);">Objectif de la saison</div><div class="mod-desc">${calendarChoice.goal.label}</div></div>
    </div>
    <div class="stage-p" style="margin-bottom:10px;"><i>${calendarChoice.introText}</i></div>
    <div class="eyebrow">Focus d'entraînement</div>
    <div class="opt-grid" id="focusWrap" style="margin-bottom:16px;"></div>
    ${p.age>=30 ? '<div style="margin-bottom:14px;"><button class="btn danger" id="retireBtn">Annoncer votre retraite</button></div>' : ''}
    <div class="actions">
      <button class="btn" id="autoCalBtn">${SPARK_ICON(16)} Calendrier auto</button>
      ${!calendarChoice.expanded ? `<button class="btn outline" id="expandBtn">${CALENDAR_ICON(16)} Personnaliser le calendrier</button>` : ''}
    </div>
    ${manualHtml}
  `;

  const focusWrap = document.getElementById('focusWrap');
  TRAINING_FOCUS_OPTIONS.forEach(f=>{
    const d = document.createElement('div');
    d.className = 'opt' + (calendarChoice.focus===f.id ? ' sel' : '');
    d.innerHTML = `<div class="h">${f.label}</div><div class="d">+3 garanti cette saison</div>`;
    d.onclick = ()=>{ calendarChoice.focus = f.id; renderCalendarPhase(); };
    focusWrap.appendChild(d);
  });

  if(calendarChoice.expanded){
    const calWrap = document.getElementById('calWrap');
    CALENDAR_OPTIONS.forEach(c=>{
      const btn = document.createElement('button');
      btn.className = 'choice' + (calendarChoice.intensity===c.id ? ' sel' : '');
      btn.innerHTML = `<span class="tag">${c.tag}</span><span style="display:flex;align-items:center;gap:6px;">${BALL_ICON(14)}${c.label}</span><span class="desc">${c.desc}</span>`;
      btn.onclick = ()=>{ calendarChoice.intensity = c.id; renderCalendarPhase(); };
      calWrap.appendChild(btn);
    });

    const bigWrap = document.getElementById('bigWrap');
    SLAMS.forEach(s=>{
      const sel = !!calendarChoice.slams[s.id];
      const locked = !p.slamEligible;
      const d = document.createElement('div');
      d.className = 'opt' + (sel ? ' sel' : '') + (locked ? ' locked' : '');
      d.style.borderLeft = `4px solid ${locked ? '#C7D0C4' : s.colors.primary}`;
      d.innerHTML = locked
        ? `<div class="h">${s.label} 🔒</div><div class="d">Débloqué sous le rang #${SLAM_ELIGIBLE_RANK}</div>`
        : `<div class="h">${s.label}</div><div class="d">${s.surface} · ${s.place}</div>`;
      if(!locked){ d.onclick = ()=>{ calendarChoice.slams[s.id] = !calendarChoice.slams[s.id]; renderCalendarPhase(); }; }
      bigWrap.appendChild(d);
    });

    const mCard = document.createElement('div');
    mCard.className = 'opt';
    mCard.style.borderLeft = `4px solid ${TIER_COLORS.masters.primary}`;
    mCard.innerHTML = `<div class="h">Masters 1000</div><div class="d">${calendarChoice.masters} sélectionné(s) sur 4</div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn outline" id="mastersMinus" style="padding:6px 12px;">−</button>
        <button class="btn outline" id="mastersPlus" style="padding:6px 12px;">+</button>
      </div>`;
    bigWrap.appendChild(mCard);
    document.getElementById('mastersMinus').onclick = ()=>{ calendarChoice.masters = Math.max(0, calendarChoice.masters-1); renderCalendarPhase(); };
    document.getElementById('mastersPlus').onclick = ()=>{ calendarChoice.masters = Math.min(4, calendarChoice.masters+1); renderCalendarPhase(); };

    document.getElementById('launchSeasonBtn').onclick = ()=>{
      const choice = calendarChoice;
      calendarChoice = null;
      startSeason(p, choice);
    };
  } else {
    document.getElementById('expandBtn').onclick = ()=>{ calendarChoice.expanded = true; renderCalendarPhase(); };
  }

  const retireBtn = document.getElementById('retireBtn');
  if(retireBtn){ retireBtn.onclick = ()=>{ p.retired = true; render(); }; }

  document.getElementById('autoCalBtn').onclick = ()=>{
    const auto = autoCalendar(p);
    calendarChoice.intensity = auto.intensity;
    calendarChoice.slams = auto.slams;
    calendarChoice.masters = auto.masters;
    const choice = calendarChoice;
    calendarChoice = null;
    startSeason(p, choice);
  };
}

function renderEnd(){
  const p = player;
  const score = legendScore(p);
  const rating = legendRating(score);
  const badges = computeBadges(p);
  const comparison = careerComparison(p);
  const totalTitles = Object.values(p.titles).reduce((a,b)=>a+b,0);

  const prevHof = loadHallOfFame();
  const isNewRecord = !prevHof || score > prevHof.score;
  if(isNewRecord){ saveHallOfFame({ name:p.name, score, letter:rating.letter }); }

  app.innerHTML = `
    ${isNewRecord ? `<div class="mod-banner" style="border-left:4px solid var(--gold); margin-bottom:16px;">
      <div class="mod-icon">${TROPHY_ICON(30)}</div>
      <div><div class="mod-label" style="color:var(--gold);">🏆 Nouveau record personnel !</div>
      <div class="mod-desc">${prevHof ? `Vous dépassez votre ancien record de ${prevHof.score} points.` : 'Votre tout premier score enregistré.'}</div></div>
    </div>` : ''}
    <div class="topbar">
      <div class="brand">
        ${BALL_ICON(30)}
        <div>
          <div class="brand-name">Set Point</div>
          <div class="brand-sub">${p.forcedRetire ? 'Fin de carrière forcée' : 'Retraite annoncée'} · ${p.seasonsPlayed} saisons</div>
        </div>
      </div>
      <div class="rank-box">
        <span class="rank-lbl">Meilleur classement</span>
        <span class="rank-num mono">#${p.bestRank}</span>
      </div>
    </div>

    <div class="card">
      <div class="rating">
        <div class="rating-bg">${TROPHY_ICON(120)}</div>
        <div class="letter">${rating.letter}</div>
        <div class="flavor">${rating.flavor}</div>
        <div class="score">Score : ${score}</div>
      </div>

      <div class="stage-h">${p.name} — bilan</div>
      <div class="stage-p">${careerNarrative(p)}</div>
      <div class="recap-row"><span class="l">Titres du Grand Chelem</span><span class="r gold">${p.titles.slam}</span></div>
      <div class="recap-row"><span class="l">Titres Masters 1000</span><span class="r">${p.titles.masters}</span></div>
      <div class="recap-row"><span class="l">Titres ${p.circuit==='women'?'WTA':'ATP'} 500</span><span class="r">${p.titles.atp500}</span></div>
      <div class="recap-row"><span class="l">Titres ${p.circuit==='women'?'WTA':'ATP'} 250</span><span class="r">${p.titles.atp250}</span></div>
      <div class="recap-row"><span class="l">Titres Challenger</span><span class="r">${p.titles.challenger}</span></div>
      <div class="recap-row"><span class="l">Total de titres</span><span class="r good">${totalTitles}</span></div>
      <div class="recap-row"><span class="l">Gains cumulés</span><span class="r gold">${eur(p.money)}</span></div>
      <div class="recap-row"><span class="l">Blessures</span><span class="r ${p.injuries.length?'bad':''}">${p.injuries.length}</span></div>
      <div class="recap-row"><span class="l">Retraite à</span><span class="r">${p.age} ans</span></div>

      <div class="eyebrow" style="margin-top:20px;">Badges</div>
      <div class="badges">${badges.map(b=>`<div class="badge"><div class="h" style="display:flex;align-items:center;gap:6px;">${STAR_ICON(15)}${b.h}</div><div class="d">${b.d}</div></div>`).join('')}</div>

      <div class="eyebrow" style="margin-top:20px;">Comparaison de carrière</div>
      <div class="stage-p">Sur l'échelle des grandes carrières du circuit (${comparison.rankAmong}ᵉ position sur ${comparison.total}), votre score de ${comparison.score} points vous rapproche le plus de <b>${comparison.closest.name}</b> : ${comparison.closest.blurb}</div>
      <div class="recap-row"><span class="l">${comparison.closest.name}</span><span class="r">${comparison.closest.score} pts</span></div>
      <div class="recap-row"><span class="l">${p.name}</span><span class="r good">${comparison.score} pts</span></div>

      <div class="actions"><button class="btn" onclick="player=null; render()">Rejouer une carrière</button></div>
    </div>
  `;
}

document.getElementById('bg-court').innerHTML = COURT_BACKDROP(choose(COURT_PALETTES));
render();

</script>
